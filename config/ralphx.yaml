# RalphX runtime configuration
#
# Canonical ownership:
# - Per-agent metadata -> `agents/<agent>/agent.yaml`
# - Claude harness globals/tool sets -> `config/harnesses/claude.yaml`
# - Codex harness defaults -> `config/harnesses/codex.yaml`
# - Process mapping -> `config/processes.yaml`
# - External MCP defaults -> `config/external-mcp.yaml`
# Notes:
# - Unknown attributes are ignored by the current parser.
# - Missing/invalid config falls back to embedded defaults bundled at compile time.

# defer_merge_enabled:
#   Controls merge deferral behavior.
#   - true (default): Defers merges when conflicts exist or agents are running
#   - false: All merges proceed immediately without deferral
#
# Env override: RALPHX_DEFER_MERGE_ENABLED=true|false
defer_merge_enabled: false

# Write tracing output to a per-launch log file in addition to console.
# Dev: .artifacts/logs/ralphx_YYYY-MM-DD_HH-MM-SS.log | Prod: ~/Library/Application Support/com.ralphx.app/logs/
# Env override: RALPHX_FILE_LOGGING=true|false
file_logging: true

# Maximum bytes retained in each per-launch log (including the cap marker).
# Env override: RALPHX_FILE_LOGGING_MAX_BYTES (default: 1073741824 / 1 GiB)
file_logging_max_bytes: 1073741824

# Number of prior per-launch ralphx_*.log files to retain on startup.
# Env override: RALPHX_FILE_LOGGING_KEEP_FILES (default: 5)
file_logging_keep_files: 5

# Whole-process deadline for RunEvent::Exit cleanup. A detached watchdog forces
# process exit if terminals, agents, external MCP, or WAL cleanup hangs.
shutdown:
  watchdog_deadline_secs: 20 # Env: RALPHX_SHUTDOWN_WATCHDOG_DEADLINE_SECS

# Startup-only SQLite compaction. Manual requests bypass the auto thresholds but not backup/headroom guards.
# Env: RALPHX_DB_AUTO_COMPACT_ENABLED, RALPHX_DB_AUTO_COMPACT_MAX_DB_BYTES, RALPHX_DB_AUTO_COMPACT_MIN_FREELIST_PERCENT
database_maintenance:
  db_auto_compact_enabled: true
  db_auto_compact_max_db_bytes: 2147483648
  db_auto_compact_min_freelist_percent: 20

# Optional GitHub repository for user-submitted support issue reports.
# When omitted, RalphX uses the public product repository and shows the
# resolved destination before the user confirms submission.
# support_issue:
#   github_repository: "aigentive/ralphx.app"

# ── UI feature flags ───────────────────────────────────────────────────────
# Controls which UI pages are visible in the app.
# Env overrides: RALPHX_UI_ACTIVITY_PAGE=true|false, RALPHX_UI_EXTENSIBILITY_PAGE=true|false, RALPHX_UI_AUTOMATIONS_PAGE=true|false, RALPHX_UI_ATLASSIAN_OAUTH=true|false, RALPHX_UI_TICKETING_DASHBOARD=true|false, RALPHX_UI_AGENT_PERSONAS=true|false, RALPHX_UI_PERSONA_SWITCH_FORCES_FRESH_PROVIDER_SESSION=true|false
# Personas v2: RALPHX_UI_AGENT_PERSONAS,
# and RALPHX_UI_STANDALONE_CONVERSATIONS.
ui:
  feature_flags:
    activity_page: false
    extensibility_page: false
    automations_page: true
    atlassian_oauth: false
    ticketing_dashboard: false
    # Enables experimental agent persona controls.
    agent_personas: false
    # Enables projectless Agent conversations and Global persona builds.
    standalone_conversations: false
    # A20 escape hatch: skip --resume on the send after a persona switch.
    persona_switch_forces_fresh_provider_session: false

# Compatibility runtime row for the PersonaBuilder-only extractor. Canonical
# `agents/ralphx-persona-extractor/agent.yaml` remains authoritative.
agents:
  - name: ralphx-persona-extractor
    system_prompt_file: agents/ralphx-persona-extractor/claude/prompt.md
    model: sonnet
    mcp_tools:
      - fs_read_file
      - fs_list_dir
      - fs_grep
      - fs_glob
      - ask_user_question
      - save_persona_draft
      - get_persona_draft

# ── Execution defaults ────────────────────────────────────────────────────
# Seed values for the persisted execution settings tables.
# These apply only while the stored rows are still pristine/default.
# After the first seed, UI/DB-managed values become the source of truth.
execution_defaults:
  project:
    max_concurrent_tasks: 10
    project_ideation_max: 5
    auto_commit: true
    pause_on_failure: true
    agent_workspace_pr_autofix_default: false
    agent_workspace_pr_auto_merge_default: false
  global:
    global_max_concurrent: 20
    workspace_max_concurrent: 10
    global_ideation_max: 10
    allow_ideation_borrow_idle_execution: false

# ── Runtime timeouts & limits ──────────────────────────────────────────────
# All fields required — no Rust serde defaults. Missing keys cause a deserialization error.
# All values can be overridden by env: RALPHX_<SECTION>_<FIELD> (e.g. RALPHX_STREAM_MERGE_LINE_READ_SECS)

timeouts:
  stream:
    # chat_service_streaming.rs — max stdout silence before killing merger agent (was 180s; raised to 600s so test runs don't time out)
    merge_line_read_secs: 600 # Env: RALPHX_STREAM_MERGE_LINE_READ_SECS
    # chat_service_streaming.rs — max time with no parseable stream events from merger agent
    merge_parse_stall_secs: 180 # Env: RALPHX_STREAM_MERGE_PARSE_STALL_SECS
    # chat_service_streaming.rs — max stdout silence for reviewer agent
    review_line_read_secs: 600 # Env: RALPHX_STREAM_REVIEW_LINE_READ_SECS
    # chat_service_streaming.rs — max time with no parseable events from reviewer
    review_parse_stall_secs: 120 # Env: RALPHX_STREAM_REVIEW_PARSE_STALL_SECS
    # chat_service_streaming.rs — max stdout silence for worker/ideation/other agents
    default_line_read_secs: 600 # Env: RALPHX_STREAM_DEFAULT_LINE_READ_SECS
    # chat_service_streaming.rs — max stall for worker/ideation/other agents
    default_parse_stall_secs: 180 # Env: RALPHX_STREAM_DEFAULT_PARSE_STALL_SECS
    # chat_service_streaming.rs — minimum interval between durable snapshots while text tokens stream
    streaming_persistence_debounce_ms: 1000 # Env: RALPHX_STREAM_STREAMING_PERSISTENCE_DEBOUNCE_MS
    # chat_service_streaming.rs — max idle time (no meaningful activity) before killing agent stream
    max_wall_clock_secs: 1800 # Env: RALPHX_STREAM_MAX_WALL_CLOCK_SECS
    # chat_service_handlers.rs — slack for agent run start recorded before execution status history
    execution_attempt_start_tolerance_secs: 1 # Env: RALPHX_STREAM_EXECUTION_ATTEMPT_START_TOLERANCE_SECS
    # process exit → stream drain/finalizer grace before a dead-PID registry entry is pruned
    completion_grace_secs: 60 # Env: RALPHX_STREAM_COMPLETION_GRACE_SECS
    # running-agent launch reservation — renewed during pre-spawn preparation; expired reservations are pruned centrally
    launch_reservation_lease_secs: 30 # Env: RALPHX_STREAM_LAUNCH_RESERVATION_LEASE_SECS
    # notification_service.rs — batch eligible desktop notifications before delivery
    desktop_notification_coalesce_window_secs: 5 # Env: RALPHX_STREAM_DESKTOP_NOTIFICATION_COALESCE_WINDOW_SECS
    # startup_jobs.rs — durable notification history retention (read rows only)
    notification_retention_read_days: 30 # Env: RALPHX_STREAM_NOTIFICATION_RETENTION_READ_DAYS
    notification_retention_max_rows: 1000 # Env: RALPHX_STREAM_NOTIFICATION_RETENTION_MAX_ROWS
    # startup_jobs.rs — background full chat tool-payload retention (block previews/metadata stay)
    chat_payload_retention_enabled: true # Env: RALPHX_STREAM_CHAT_PAYLOAD_RETENTION_ENABLED
    chat_payload_retention_days: 90 # Env: RALPHX_STREAM_CHAT_PAYLOAD_RETENTION_DAYS
    chat_payload_retention_archived_days: 7 # Env: RALPHX_STREAM_CHAT_PAYLOAD_RETENTION_ARCHIVED_DAYS
    chat_payload_retention_batch_rows: 2000 # Env: RALPHX_STREAM_CHAT_PAYLOAD_RETENTION_BATCH_ROWS
    # db_connection.rs — production warning thresholds for mutex wait and operation hold time
    db_lock_wait_warn_ms: 100 # Env: RALPHX_STREAM_DB_LOCK_WAIT_WARN_MS
    db_lock_hold_warn_ms: 250 # Env: RALPHX_STREAM_DB_LOCK_HOLD_WARN_MS

# Backend-held delegation waiting. Coordinators stop burning tokens on model-side polling:
# short waits block inside `delegate_wait`, long waits park and are woken by delegate signals.
delegation:
  # native_delegation.rs — default bounded block when a caller waits without naming a duration
  wait_block_secs: 120 # Env: RALPHX_DELEGATION_WAIT_BLOCK_SECS
  # native_delegation.rs — hard cap on any caller-supplied wait_timeout_ms.
  # MUST stay strictly below timeouts.stream.default_parse_stall_secs (180) so a blocking
  # wait is never mistaken for a stalled stream and kills the waiting coordinator.
  wait_block_max_secs: 150 # Env: RALPHX_DELEGATION_WAIT_BLOCK_MAX_SECS
  # delegation_park — upper bound on how long a coordinator may stay parked before force-wake
  park_max_secs: 3600 # Env: RALPHX_DELEGATION_PARK_MAX_SECS
  # delegation_park — wake-enqueue attempts before the park is marked failed
  park_wake_retry_max: 5 # Env: RALPHX_DELEGATION_PARK_WAKE_RETRY_MAX
  # delegation_park — backoff between wake-enqueue attempts
  park_wake_retry_backoff_secs: 30 # Env: RALPHX_DELEGATION_PARK_WAKE_RETRY_BACKOFF_SECS

reconciliation:
  # reconciliation.rs — overall deadline for merger agent; triggers MergeIncomplete + auto-retry if exceeded
  merger_timeout_secs: 1200 # Env: RALPHX_RECONCILIATION_MERGER_TIMEOUT_SECS
  # reconciliation.rs — max auto-retry attempts for tasks stuck in Merging state
  merging_max_retries: 3 # Env: RALPHX_RECONCILIATION_MERGING_MAX_RETRIES
  # reconciliation.rs — PendingMerge tasks older than this (minutes) are considered stale and retried
  pending_merge_stale_minutes: 2 # Env: RALPHX_RECONCILIATION_PENDING_MERGE_STALE_MINUTES
  # reconciliation.rs — QA tasks older than this (minutes) are considered stale
  qa_stale_minutes: 5 # Env: RALPHX_RECONCILIATION_QA_STALE_MINUTES
  # reconciliation.rs — initial backoff before retrying a MergeIncomplete task (exponential)
  merge_incomplete_retry_base_secs: 5 # Env: RALPHX_RECONCILIATION_MERGE_INCOMPLETE_RETRY_BASE_SECS
  # reconciliation.rs — cap on MergeIncomplete exponential backoff
  merge_incomplete_retry_max_secs: 1800 # Env: RALPHX_RECONCILIATION_MERGE_INCOMPLETE_RETRY_MAX_SECS
  # reconciliation.rs — max auto-retry attempts for MergeIncomplete before surfacing to user
  merge_incomplete_max_retries: 15 # Env: RALPHX_RECONCILIATION_MERGE_INCOMPLETE_MAX_RETRIES
  # reconciliation.rs — max validation-revert cycles before stopping auto-retry (prevents infinite loops)
  validation_revert_max_count: 2 # Env: RALPHX_RECONCILIATION_VALIDATION_REVERT_MAX_COUNT
  # reconciliation.rs — initial backoff before retrying a MergeConflict task
  merge_conflict_retry_base_secs: 60 # Env: RALPHX_RECONCILIATION_MERGE_CONFLICT_RETRY_BASE_SECS
  # reconciliation.rs — cap on MergeConflict exponential backoff
  merge_conflict_retry_max_secs: 600 # Env: RALPHX_RECONCILIATION_MERGE_CONFLICT_RETRY_MAX_SECS
  # reconciliation.rs — max auto-retry attempts for MergeConflict
  merge_conflict_max_retries: 3 # Env: RALPHX_RECONCILIATION_MERGE_CONFLICT_MAX_RETRIES
  # reconciliation.rs — max auto-retry attempts for tasks stuck in Executing
  executing_max_retries: 5 # Env: RALPHX_RECONCILIATION_EXECUTING_MAX_RETRIES
  # reconciliation.rs — max auto-retry attempts for tasks stuck in Reviewing
  reviewing_max_retries: 3 # Env: RALPHX_RECONCILIATION_REVIEWING_MAX_RETRIES
  # reconciliation.rs — max auto-retry attempts for tasks stuck in QA
  qa_max_retries: 3 # Env: RALPHX_RECONCILIATION_QA_MAX_RETRIES
  # reconciliation.rs — total wall-clock limit for Executing state (minutes)
  executing_max_wall_clock_minutes: 60 # Env: RALPHX_RECONCILIATION_EXECUTING_MAX_WALL_CLOCK_MINUTES
  # reconciliation.rs — total wall-clock limit for Reviewing state (minutes)
  reviewing_max_wall_clock_minutes: 30 # Env: RALPHX_RECONCILIATION_REVIEWING_MAX_WALL_CLOCK_MINUTES
  # reconciliation.rs — total wall-clock limit for QA state (minutes)
  qa_max_wall_clock_minutes: 15 # Env: RALPHX_RECONCILIATION_QA_MAX_WALL_CLOCK_MINUTES
  # side_effects.rs — max wall-clock seconds for programmatic merge attempt (cleanup + strategy dispatch)
  attempt_merge_deadline_secs: 120 # Env: RALPHX_RECONCILIATION_ATTEMPT_MERGE_DEADLINE_SECS
  # merge_outcome_handler.rs — max wall-clock seconds for post-merge validation commands (separate from git deadline)
  validation_deadline_secs: 1200 # Env: RALPHX_RECONCILIATION_VALIDATION_DEADLINE_SECS
  # handlers/merge.rs — grace period after merger agent run created before checking run-state vs registry (covers agent startup)
  merge_registry_grace_period_secs: 60 # Env: RALPHX_RECONCILIATION_MERGE_REGISTRY_GRACE_PERIOD_SECS
  # handlers/merge.rs — minimum cooldown before retrying after a validation failure (prevents rapid retry loops)
  validation_retry_min_cooldown_secs: 120 # Env: RALPHX_RECONCILIATION_VALIDATION_RETRY_MIN_COOLDOWN_SECS
  # handlers/merge.rs — stop auto-retrying after N consecutive validation failures (circuit breaker)
  validation_failure_circuit_breaker_count: 3 # Env: RALPHX_RECONCILIATION_VALIDATION_FAILURE_CIRCUIT_BREAKER_COUNT
  # handlers/merge.rs — skip MergeIncomplete retry if task was retried within this many seconds (starvation guard)
  merge_starvation_guard_secs: 60 # Env: RALPHX_RECONCILIATION_MERGE_STARVATION_GUARD_SECS
  # side_effects.rs — max seconds for pre_merge_cleanup before proceeding to merge (cleanup is best-effort)
  pre_merge_cleanup_timeout_secs: 60 # Env: RALPHX_RECONCILIATION_PRE_MERGE_CLEANUP_TIMEOUT_SECS
  # side_effects.rs — max seconds for branch freshness updates (update_plan_from_main, update_source_from_target)
  branch_freshness_timeout_secs: 60 # Env: RALPHX_RECONCILIATION_BRANCH_FRESHNESS_TIMEOUT_SECS
  # chat_service_merge.rs — grace period before merge watcher starts polling git state
  merge_watcher_grace_secs: 30 # Env: RALPHX_RECONCILIATION_MERGE_WATCHER_GRACE_SECS
  # chat_service_merge.rs — poll interval for merge watcher git state checks
  merge_watcher_poll_secs: 15 # Env: RALPHX_RECONCILIATION_MERGE_WATCHER_POLL_SECS
  # Circuit breaker: fires when threshold+ of last window failures share the same source
  merge_circuit_breaker_threshold: 3 # Env: RALPHX_MERGE_CIRCUIT_BREAKER_THRESHOLD
  merge_circuit_breaker_window: 5 # Env: RALPHX_MERGE_CIRCUIT_BREAKER_WINDOW
  # execution recovery — max auto-retry attempts for Failed tasks with transient failures (timeout/crash/stall)
  execution_failed_max_retries: 3 # Env: RALPHX_RECONCILIATION_EXECUTION_FAILED_MAX_RETRIES
  # execution recovery — initial backoff before retrying a Failed execution task (exponential base, seconds)
  execution_failed_retry_base_secs: 30 # Env: RALPHX_RECONCILIATION_EXECUTION_FAILED_RETRY_BASE_SECS
  # execution recovery — cap on execution retry exponential backoff (seconds)
  execution_failed_retry_max_secs: 600 # Env: RALPHX_RECONCILIATION_EXECUTION_FAILED_RETRY_MAX_SECS
  # execution recovery — Failed tasks older than this (seconds) are skipped at startup (stale guard)
  recovery_staleness_secs: 86400 # Env: RALPHX_RECONCILIATION_RECOVERY_STALENESS_SECS

git:
  # git_service/git_cmd.rs — per-command timeout to prevent hung git processes
  cmd_timeout_secs: 60 # Env: RALPHX_GIT_CMD_TIMEOUT_SECS
  # startup_git_auth_preflight.rs — total budget for each startup Git/GitHub auth probe
  startup_auth_preflight_timeout_secs: 10 # Env: RALPHX_GIT_STARTUP_AUTH_PREFLIGHT_TIMEOUT_SECS
  # git_service/git_cmd.rs — max retry attempts for transient git failures
  max_retries: 3 # Env: RALPHX_GIT_MAX_RETRIES
  # git_service/git_cmd.rs — delay between retries (list, not env-overridable)
  retry_backoff_secs: [1, 2, 4]
  # side_effects.rs — age threshold for removing a stale .git/index.lock file
  index_lock_stale_secs: 5 # Env: RALPHX_GIT_INDEX_LOCK_STALE_SECS
  # unified_chat_commands.rs — short backend TTL for repeated workspace freshness checks
  workspace_freshness_cache_ttl_ms: 2000 # Env: RALPHX_GIT_WORKSPACE_FRESHNESS_CACHE_TTL_MS
  # diff_commands.rs — short backend TTL for workspace review context/payload reuse
  workspace_review_cache_ttl_ms: 2000 # Env: RALPHX_GIT_WORKSPACE_REVIEW_CACHE_TTL_MS
  # agent_workspace_pr_description.rs — short backend TTL for precomputed publish PR descriptions
  workspace_pr_description_cache_ttl_ms: 300000 # Env: RALPHX_GIT_WORKSPACE_PR_DESCRIPTION_CACHE_TTL_MS
  # diff_commands.rs — short backend TTL for live GitHub PR annotation payload reuse
  workspace_pr_annotations_cache_ttl_ms: 30000 # Env: RALPHX_GIT_WORKSPACE_PR_ANNOTATIONS_CACHE_TTL_MS
  # gh_cli_github_service.rs — max annotated check runs queried for per-run annotations per PR payload
  workspace_pr_annotations_check_run_fetch_limit: 10 # Env: RALPHX_GIT_WORKSPACE_PR_ANNOTATIONS_CHECK_RUN_FETCH_LIMIT
  # agent_workspace_external_pr_reconciliation.rs — TTL for external PR lookup attempts on unlinked agent workspaces
  agent_workspace_pr_reconciliation_cache_ttl_ms: 30000 # Env: RALPHX_GIT_AGENT_WORKSPACE_PR_RECONCILIATION_CACHE_TTL_MS
  # pr_merge_poller.rs — maximum wait for a workflow run to conclude before a deferred rerun blocks
  agent_workspace_ci_rerun_deferral_deadline_secs: 3600 # Env: RALPHX_GIT_AGENT_WORKSPACE_CI_RERUN_DEFERRAL_DEADLINE_SECS
  # pr_startup_recovery.rs — periodic retry cadence for terminal PR local branch/worktree cleanup
  terminal_pr_local_cleanup_interval_secs: 900 # Env: RALPHX_GIT_TERMINAL_PR_LOCAL_CLEANUP_INTERVAL_SECS
  # pr_startup_recovery.rs — retry window for retryable terminal PR cleanup markers
  terminal_pr_local_cleanup_retry_secs: 3600 # Env: RALPHX_GIT_TERMINAL_PR_LOCAL_CLEANUP_RETRY_SECS
  # orphan_worktree_cleanup.rs — retry window for unchanged dirty/unsafe orphan agent-worktree cleanup markers
  orphan_worktree_cleanup_marker_retry_secs: 86400 # Env: RALPHX_GIT_ORPHAN_WORKTREE_CLEANUP_MARKER_RETRY_SECS
  # orphan_worktree_cleanup.rs — same-process orphan cleanup cadence (0 disables periodic cleanup)
  orphan_worktree_cleanup_interval_secs: 900 # Env: RALPHX_GIT_ORPHAN_WORKTREE_CLEANUP_INTERVAL_SECS
  # merge_coordination.rs — settle time after SIGTERM before worktree deletion
  agent_kill_settle_secs: 0 # Env: RALPHX_GIT_AGENT_KILL_SETTLE_SECS
  # merge_coordination.rs — timeout for each stop_agent() call in pre-merge cleanup step 0
  agent_stop_timeout_secs: 3 # Env: RALPHX_GIT_AGENT_STOP_TIMEOUT_SECS
  # merge_coordination.rs — timeout for task worktree deletion during pre-merge cleanup
  cleanup_worktree_timeout_secs: 15 # Env: RALPHX_GIT_CLEANUP_WORKTREE_TIMEOUT_SECS
  # merge_coordination.rs — timeout for merge/rebase worktree deletion and git clean
  cleanup_git_op_timeout_secs: 30 # Env: RALPHX_GIT_CLEANUP_GIT_OP_TIMEOUT_SECS
  # running_agent_registry.rs — timeout for lsof +D scan in kill_worktree_processes_async
  worktree_lsof_timeout_secs: 10 # Env: RALPHX_GIT_WORKTREE_LSOF_TIMEOUT_SECS
  # merge_coordination.rs — outer timeout for entire step 0b kill phase (defense in depth)
  step_0b_kill_timeout_secs: 5 # Env: RALPHX_GIT_STEP_0B_KILL_TIMEOUT_SECS

scheduler:
  # task_scheduler_service.rs — how often the watchdog scans for stuck/stale tasks
  watchdog_interval_secs: 60 # Env: RALPHX_SCHEDULER_WATCHDOG_INTERVAL_SECS
  # task_scheduler_service.rs — how long a Ready task can sit before considered stale
  watchdog_stale_threshold_secs: 30 # Env: RALPHX_SCHEDULER_WATCHDOG_STALE_THRESHOLD_SECS
  # task_scheduler_service.rs — max spawn retries when task slot contention occurs
  max_contention_retries: 3 # Env: RALPHX_SCHEDULER_MAX_CONTENTION_RETRIES
  # task_scheduler_service.rs — sleep between contention retry attempts (milliseconds)
  contention_retry_delay_ms: 200 # Env: RALPHX_SCHEDULER_CONTENTION_RETRY_DELAY_MS
  # on_enter_states.rs — settle delay before spawning agent for a newly-Ready task (milliseconds)
  ready_settle_ms: 300 # Env: RALPHX_SCHEDULER_READY_SETTLE_MS
  # on_enter_states.rs — settle delay before scheduling unblocked tasks after a merge completes (milliseconds)
  merge_settle_ms: 100 # Env: RALPHX_SCHEDULER_MERGE_SETTLE_MS

automations:
  # automation scheduler — authoritative poll cadence for automation runs and PR completion signals
  scheduler_poll_secs: 30 # Env: RALPHX_AUTOMATIONS_SCHEDULER_POLL_SECS
  # automation scheduler — consecutive GitHub signal-check failures before pausing an automation
  signal_failure_pause_threshold: 5 # Env: RALPHX_AUTOMATIONS_SIGNAL_FAILURE_PAUSE_THRESHOLD
  # automation judge — maximum wall-clock seconds for a judge pass
  judge_timeout_secs: 180 # Env: RALPHX_AUTOMATIONS_JUDGE_TIMEOUT_SECS
  # automation scheduler — grace period after agent completion before scheduler-driven publish
  publish_grace_secs: 120 # Env: RALPHX_AUTOMATIONS_PUBLISH_GRACE_SECS
  # automation scheduler — maximum wall-clock seconds for a running automation run
  max_run_duration_secs: 14400 # Env: RALPHX_AUTOMATIONS_MAX_RUN_DURATION_SECS
  # automation plan judge — provider-keyed model floor for automatic plan approval
  plan_judge_model:
    claude: sonnet # Env: RALPHX_AUTOMATIONS_PLAN_JUDGE_MODEL_CLAUDE
    codex: gpt-5.4 # Env: RALPHX_AUTOMATIONS_PLAN_JUDGE_MODEL_CODEX
  # automation plan judge — max plan revision rounds before pausing for human review
  plan_max_revision_rounds: 3 # Env: RALPHX_AUTOMATIONS_PLAN_MAX_REVISION_ROUNDS

supervisor:
  # supervisor_service.rs — wall-clock seconds before supervisor warns agent about time usage
  time_threshold_secs: 600 # Env: RALPHX_SUPERVISOR_TIME_THRESHOLD_SECS
  # supervisor_service.rs — token count at which supervisor warns agent
  token_threshold: 50000 # Env: RALPHX_SUPERVISOR_TOKEN_THRESHOLD
  # supervisor_service.rs — token count at which supervisor forces agent stop
  max_tokens: 100000 # Env: RALPHX_SUPERVISOR_MAX_TOKENS
  # supervisor_service.rs — how often supervisor checks for stuck/looping behavior
  progress_interval_secs: 30 # Env: RALPHX_SUPERVISOR_PROGRESS_INTERVAL_SECS
  # supervisor_service.rs — min repetitions before classifying as a loop
  loop_threshold: 3 # Env: RALPHX_SUPERVISOR_LOOP_THRESHOLD
  # supervisor_service.rs — min stuck-checks before taking action
  stuck_threshold: 5 # Env: RALPHX_SUPERVISOR_STUCK_THRESHOLD

limits:
  # chat_service_errors.rs — max times an agent conversation is auto-resumed after a provider error
  max_resume_attempts: 5 # Env: RALPHX_LIMITS_MAX_RESUME_ATTEMPTS

  # agent_workspace repair — total agent minutes spent on one PR failure identity before RalphX
  # stops retrying and hands the failure to a human. 0 disables the budget.
  # Env: RALPHX_LIMITS_REPAIR_FINGERPRINT_BUDGET_MINUTES
  repair_fingerprint_budget_minutes: 45

ideation:
  # Seconds of inactivity before an agent is considered "likely_waiting" vs "likely_generating".
  # Used by get_child_session_status MCP tool to derive estimated_status. Env: RALPHX_IDEATION_ACTIVITY_THRESHOLD_SECS
  child_session_activity_threshold_secs: 10
  verification:
    # accept-plan retry self-heal — supersede orphaned execution plans with no tasks/links after this many seconds
    # Env: RALPHX_VERIFICATION_ACCEPT_STALE_EXECUTION_PLAN_SECS
    accept_stale_execution_plan_secs: 30
