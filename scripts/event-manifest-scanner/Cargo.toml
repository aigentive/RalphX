[package]
name = "event-manifest-scanner"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
proc-macro2 = { version = "1", features = ["span-locations"] }
ralphx-remote-protocol = { path = "../../src-tauri/crates/ralphx-remote-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "2", features = ["full", "visit"] }
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-typescript = "0.23"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
