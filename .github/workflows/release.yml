name: Release Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git tag ref to build from (for example v0.2.0 or refs/tags/v0.2.0)"
        required: true
      version:
        description: "Version to release (for example 0.2.0 or v0.2.0)"
        required: true
      linux_runner:
        description: "Runner to use for release metadata jobs"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - depot
          - github-hosted
          - self-hosted
      arm_runner:
        description: "Runner to use for the macOS ARM release build"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - depot
          - self-hosted
          - github-hosted
      intel_runner:
        description: "Runner to use for the macOS Intel release build"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - depot
          - self-hosted
          - github-hosted
      macos_runner_size:
        description: "GitHub-hosted macOS runner size for release builds"
        required: true
        type: choice
        default: standard
        options:
          - standard
          - larger

permissions:
  contents: read

concurrency:
  group: release-build-${{ github.event.inputs.version }}
  cancel-in-progress: true

jobs:
  metadata:
    name: Resolve release metadata
    runs-on: ${{ fromJSON(inputs.linux_runner == 'depot' && '"depot-ubuntu-24.04"' || inputs.linux_runner == 'self-hosted' && '["self-hosted","Linux","X64","ralphx-release"]' || inputs.linux_runner == 'github-hosted' && '"ubuntu-latest"' || '"blacksmith-32vcpu-ubuntu-2404"') }}
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      source_ref: ${{ steps.meta.outputs.source_ref }}
      build_matrix: ${{ steps.meta.outputs.build_matrix }}
    steps:
      - name: Resolve release metadata
        id: meta
        shell: bash
        env:
          INPUT_REF: ${{ inputs.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_ARM_RUNNER: ${{ inputs.arm_runner }}
          INPUT_INTEL_RUNNER: ${{ inputs.intel_runner }}
          INPUT_MACOS_RUNNER_SIZE: ${{ inputs.macos_runner_size }}
        run: |
          set -euo pipefail

          raw_ref="${INPUT_REF}"
          raw_version="${INPUT_VERSION}"
          raw_draft="false"
          raw_prerelease="true"
          raw_arm_runner="${INPUT_ARM_RUNNER}"
          raw_intel_runner="${INPUT_INTEL_RUNNER}"
          raw_macos_runner_size="${INPUT_MACOS_RUNNER_SIZE}"

          version="${raw_version#v}"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release version must be an exact X.Y.Z version" >&2
            exit 1
          fi

          tag="v${version}"
          release_name="RalphX.app ${tag}"
          normalized_ref="${raw_ref#refs/tags/}"

          if [[ "${normalized_ref}" != "${tag}" ]]; then
            echo "Release ref must match the requested version tag. Expected ${tag}, got ${raw_ref}." >&2
            exit 1
          fi

          resolve_macos_runner() {
            local arch="$1"
            local provider="$2"
            local runs_on
            local runner_kind

            case "${provider}" in
              blacksmith)
                runs_on='"blacksmith-12vcpu-macos-15"'
                runner_kind="blacksmith"
                ;;
              depot)
                runs_on='"depot-macos-15"'
                runner_kind="depot"
                ;;
              github-hosted)
                if [[ "${arch}" == "aarch64" ]]; then
                  if [[ "${raw_macos_runner_size}" == "larger" ]]; then
                    runs_on='"macos-15-xlarge"'
                    runner_kind="github-hosted-larger"
                  else
                    runs_on='"macos-15"'
                    runner_kind="github-hosted"
                  fi
                elif [[ "${raw_macos_runner_size}" == "larger" ]]; then
                  runs_on='"macos-15-large"'
                  runner_kind="github-hosted-larger"
                else
                  runs_on='"macos-15-intel"'
                  runner_kind="github-hosted"
                fi
                ;;
              self-hosted)
                if [[ "${arch}" == "aarch64" ]]; then
                  runs_on='["self-hosted","macOS","ARM64","ralphx-release"]'
                else
                  runs_on='["self-hosted","macOS","X64","ralphx-release"]'
                fi
                runner_kind="self-hosted"
                ;;
              *)
                echo "Invalid macOS runner provider for ${arch}: ${provider}" >&2
                exit 1
                ;;
            esac

            printf '%s\t%s\n' "${runs_on}" "${runner_kind}"
          }

          IFS=$'\t' read -r arm_runs_on arm_runner_kind < <(resolve_macos_runner "aarch64" "${raw_arm_runner}")
          IFS=$'\t' read -r intel_runs_on intel_runner_kind < <(resolve_macos_runner "x86_64" "${raw_intel_runner}")

          build_matrix="$(
            jq -cn \
              --arg arm_arch "aarch64" \
              --arg arm_runs_on "${arm_runs_on}" \
              --arg arm_runner_kind "${arm_runner_kind}" \
              --arg arm_rust_target "aarch64-apple-darwin" \
              --arg intel_arch "x86_64" \
              --arg intel_runs_on "${intel_runs_on}" \
              --arg intel_runner_kind "${intel_runner_kind}" \
              --arg intel_rust_target "x86_64-apple-darwin" \
              '{include: [
                {
                  arch: $arm_arch,
                  runs_on: $arm_runs_on,
                  runner_kind: $arm_runner_kind,
                  rust_target: $arm_rust_target
                },
                {
                  arch: $intel_arch,
                  runs_on: $intel_runs_on,
                  runner_kind: $intel_runner_kind,
                  rust_target: $intel_rust_target
                }
              ]}'
          )"

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release_name=${release_name}"
            echo "draft=${raw_draft}"
            echo "prerelease=${raw_prerelease}"
            echo "source_ref=refs/tags/${tag}"
            echo "build_matrix=${build_matrix}"
          } >> "${GITHUB_OUTPUT}"

      - name: Write release notes artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
        run: |
          set -euo pipefail

          mkdir -p release-metadata
          notes_file="release-notes/${RELEASE_TAG}.md"
          if notes_content="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/contents/${notes_file}?ref=${RELEASE_TAG}" \
            --jq '.content' 2>/dev/null)"; then
            printf '%s' "${notes_content}" | tr -d '\n' | base64 --decode > release-metadata/github-release-notes.md
          else
            {
              printf 'Release artifacts for %s.\n\n' "${RELEASE_TAG}"
              printf 'Included:\n'
              printf '%s\n' \
                '- macOS Apple Silicon DMG' \
                '- macOS Intel DMG' \
                '- macOS Apple Silicon updater bundle' \
                '- macOS Intel updater bundle' \
                '- latest.json' \
                '- checksums.txt'
            } > release-metadata/github-release-notes.md
          fi

          awk '
            $0 == "<!-- github-release-metadata:start -->" { dropping = 1; next }
            $0 == "<!-- github-release-metadata:end -->" { dropping = 0; next }
            !dropping { print }
          ' release-metadata/github-release-notes.md | awk '
            { lines[NR] = $0 }
            END {
              last = NR
              while (last > 0 && lines[last] == "") {
                last--
              }
              for (i = 1; i <= last; i++) {
                print lines[i]
              }
            }
          ' > release-metadata/release-notes.md

      - name: Write release metadata artifact
        shell: bash
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_NAME: ${{ steps.meta.outputs.release_name }}
          RELEASE_DRAFT: ${{ steps.meta.outputs.draft }}
          RELEASE_PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          RELEASE_SOURCE_REF: ${{ steps.meta.outputs.source_ref }}
        run: |
          set -euo pipefail
          jq -n \
            --arg version "${RELEASE_VERSION}" \
            --arg tag "${RELEASE_TAG}" \
            --arg release_name "${RELEASE_NAME}" \
            --arg draft "${RELEASE_DRAFT}" \
            --arg prerelease "${RELEASE_PRERELEASE}" \
            --arg source_ref "${RELEASE_SOURCE_REF}" \
            '{
              version: $version,
              tag: $tag,
              release_name: $release_name,
              draft: $draft,
              prerelease: $prerelease,
              source_ref: $source_ref
            }' > release-metadata/release-metadata.json

      - name: Upload release metadata artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-metadata
          path: |
            release-metadata/release-metadata.json
            release-metadata/github-release-notes.md
            release-metadata/release-notes.md
          if-no-files-found: error

  build-macos:
    name: Build macOS ${{ matrix.arch }}
    needs: metadata
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.metadata.outputs.build_matrix) }}
    runs-on: ${{ fromJSON(matrix.runs_on) }}
    env:
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.metadata.outputs.source_ref }}

      - name: Validate signing environment
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          required_vars=(
            APPLE_CERTIFICATE
            APPLE_CERTIFICATE_PASSWORD
            APPLE_SIGNING_IDENTITY
            APPLE_API_KEY
            APPLE_API_ISSUER
            APPLE_API_KEY_P8
            APPLE_TEAM_ID
            TAURI_SIGNING_PRIVATE_KEY
            TAURI_SIGNING_PRIVATE_KEY_PASSWORD
          )

          for name in "${required_vars[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing required secret: ${name}" >&2
              exit 1
            fi
          done

      - name: Materialize App Store Connect API key
        id: api_key
        shell: bash
        run: |
          set -euo pipefail
          key_dir="${RUNNER_TEMP}/private_keys"
          key_path="${key_dir}/AuthKey_${APPLE_API_KEY}.p8"
          mkdir -p "${key_dir}"
          printf '%s' "${APPLE_API_KEY_P8}" > "${key_path}"
          chmod 600 "${key_path}"
          echo "api_key_path=${key_path}" >> "${GITHUB_OUTPUT}"

      - name: Generate temporary signing keychain password
        id: keychain
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "password=$(openssl rand -base64 24 | tr -d '\n')"
            echo "path=${RUNNER_TEMP}/ralphx-release-${{ matrix.arch }}.keychain-db"
            echo "search_list_path=${RUNNER_TEMP}/ralphx-release-${{ matrix.arch }}-keychains.txt"
          } >> "${GITHUB_OUTPUT}"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            plugins/app/ralphx-mcp-server/package-lock.json
            plugins/app/ralphx-external-mcp/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          targets: ${{ matrix.rust_target }}

      - name: Install Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustup target add "${{ matrix.rust_target }}"
          rustup target list --installed

      - name: Rust cache
        uses: swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Checkout workflow automation support
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow-support

      - name: Overlay release automation scripts from workflow ref
        shell: bash
        run: |
          set -euo pipefail
          install -m 0755 workflow-support/scripts/build-prod-release.sh scripts/build-prod-release.sh
          install -m 0755 workflow-support/scripts/prepare-release-runtime.sh scripts/prepare-release-runtime.sh
          install -m 0755 workflow-support/scripts/validate-macos-release-artifacts.sh scripts/validate-macos-release-artifacts.sh

      - name: Import Apple certificate
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ steps.keychain.outputs.password }}
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.path }}
          KEYCHAIN_SEARCH_LIST_PATH: ${{ steps.keychain.outputs.search_list_path }}
        run: |
          set -euo pipefail

          curl -L --fail --silent --show-error \
            https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer \
            --output developer-id-g2.cer

          echo "${APPLE_CERTIFICATE}" | base64 --decode > certificate.p12
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          security create-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security list-keychains -d user | sed 's/^[[:space:]]*\"//; s/\"$//' > "${KEYCHAIN_SEARCH_LIST_PATH}"
          keychain_search_list=("${KEYCHAIN_PATH}")
          while IFS= read -r keychain; do
            if [[ -n "${keychain}" && "${keychain}" != "${KEYCHAIN_PATH}" ]]; then
              keychain_search_list+=("${keychain}")
            fi
          done < "${KEYCHAIN_SEARCH_LIST_PATH}"
          security list-keychains -d user -s "${keychain_search_list[@]}"
          security unlock-keychain -p "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          security set-keychain-settings -t 3600 -u "${KEYCHAIN_PATH}"
          security import developer-id-g2.cer -k "${KEYCHAIN_PATH}" -A
          security import certificate.p12 -k "${KEYCHAIN_PATH}" -P "${APPLE_CERTIFICATE_PASSWORD}" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASSWORD}" "${KEYCHAIN_PATH}"
          rm developer-id-g2.cer certificate.p12

      - name: Validate imported signing identity
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.path }}
        run: |
          set -euo pipefail

          identities="$(security find-identity -v -p codesigning "${KEYCHAIN_PATH}")"
          identity_count="$(
            awk '/[0-9]+\) [0-9A-F]{40} / { count += 1 } END { print count + 0 }' <<< "${identities}"
          )"

          if [[ "${identity_count}" -ne 1 ]]; then
            echo "Imported codesigning identities:" >&2
            echo "${identities}" >&2
            echo "Expected exactly 1 codesigning identity after importing APPLE_CERTIFICATE; found ${identity_count}. Export a single-identity .p12." >&2
            exit 1
          fi

          if ! grep -Fq "\"${APPLE_SIGNING_IDENTITY}\"" <<< "${identities}"; then
            echo "Imported codesigning identities:" >&2
            echo "${identities}" >&2
            echo "Imported signing identity does not match APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY}" >&2
            exit 1
          fi

          echo "Validated imported signing identity."

      - name: Build production release artifacts
        shell: bash
        env:
          APPLE_API_KEY_PATH: ${{ steps.api_key.outputs.api_key_path }}
          RALPHX_RELEASE_TRACE_DIR: release-trace/${{ matrix.arch }}
        run: |
          set -euo pipefail

          trace_dir="release-trace/${{ matrix.arch }}"
          build_log="${trace_dir}/workflow-build.log"
          heartbeat_log="${trace_dir}/workflow-heartbeat.log"

          mkdir -p "${trace_dir}"
          : > "${build_log}"
          : > "${heartbeat_log}"

          heartbeat() {
            while true; do
              printf '[release-heartbeat] %s build step still running for %s\n' \
                "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
                "${{ matrix.arch }}" | tee -a "${heartbeat_log}"
              # shellcheck disable=SC2009
              ps -axo pid,ppid,etime,stat,comm \
                | grep -E 'codesign$|notarytool$|xcrun$|cargo-tauri$|cargo$|node$|ralphx$' \
                | grep -v 'grep -E' \
                | sed 's/^/[release-heartbeat] process /' \
                | tee -a "${heartbeat_log}" || true
              sleep 60
            done
          }

          heartbeat &
          heartbeat_pid=$!

          cleanup() {
            kill "${heartbeat_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '[release-heartbeat] %s starting build script for %s\n' \
            "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "${{ matrix.arch }}" | tee -a "${heartbeat_log}"

          echo "[release-heartbeat] ${{
            matrix.arch
          }} using pre-imported build.keychain; clearing APPLE_CERTIFICATE env to avoid duplicate Tauri keychain import" | tee -a "${heartbeat_log}"
          unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD

          ./scripts/build-prod-release.sh \
            --target "${{ matrix.rust_target }}" \
            --expected-arch "${{ matrix.arch }}" \
            2>&1 | tee -a "${build_log}"

          printf '[release-heartbeat] %s build script completed for %s\n' \
            "$(date -u +"%Y-%m-%dT%H:%M:%SZ")" \
            "${{ matrix.arch }}" | tee -a "${heartbeat_log}"

      - name: Upload release trace logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-trace-${{ matrix.arch }}
          path: release-trace/${{ matrix.arch }}/*
          if-no-files-found: warn

      - name: Collect release artifacts
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          MATRIX_ARCH: ${{ matrix.arch }}
          MATRIX_RUST_TARGET: ${{ matrix.rust_target }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION}"
          arch="${MATRIX_ARCH}"
          dist_dir="release-dist/${arch}"
          mkdir -p "${dist_dir}"

          release_target_dir="src-tauri/target/${MATRIX_RUST_TARGET}/release"
          select_single_artifact() {
            local directory="$1"
            local pattern="$2"
            local label="$3"
            local matches=()
            local path
            while IFS= read -r -d '' path; do
              matches+=("${path}")
            done < <(find "${directory}" -maxdepth 1 -type f -name "${pattern}" -print0)
            if [[ "${#matches[@]}" -ne 1 ]]; then
              echo "Expected exactly one ${label} under ${directory}; found ${#matches[@]}" >&2
              return 1
            fi
            printf '%s\n' "${matches[0]}"
          }

          dmg_path="$(select_single_artifact "${release_target_dir}/bundle/dmg" '*.dmg' 'DMG artifact')"
          updater_path="$(select_single_artifact "${release_target_dir}/bundle/macos" '*.app.tar.gz' 'updater artifact')"

          sig_path="${updater_path}.sig"
          if [[ ! -f "${sig_path}" ]]; then
            echo "Updater signature not found for ${updater_path}" >&2
            exit 1
          fi

          cp "${dmg_path}" "${dist_dir}/RalphX_${version}_${arch}.dmg"
          cp "${updater_path}" "${dist_dir}/RalphX_${version}_${arch}.app.tar.gz"
          cp "${sig_path}" "${dist_dir}/RalphX_${version}_${arch}.app.tar.gz.sig"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: release-dist/${{ matrix.arch }}/*
          if-no-files-found: error

      - name: Delete temporary signing keychain
        if: always()
        shell: bash
        env:
          KEYCHAIN_PATH: ${{ steps.keychain.outputs.path }}
          KEYCHAIN_SEARCH_LIST_PATH: ${{ steps.keychain.outputs.search_list_path }}
        run: |
          set -euo pipefail
          if [[ -f "${KEYCHAIN_SEARCH_LIST_PATH}" ]]; then
            restored_keychains=()
            while IFS= read -r keychain; do
              if [[ -n "${keychain}" ]]; then
                restored_keychains+=("${keychain}")
              fi
            done < "${KEYCHAIN_SEARCH_LIST_PATH}"
            if [[ "${#restored_keychains[@]}" -gt 0 ]]; then
              security list-keychains -d user -s "${restored_keychains[@]}"
            fi
          fi
          security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          rm -f "${KEYCHAIN_SEARCH_LIST_PATH}"
