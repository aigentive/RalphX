name: Stable Release Control

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "promote makes candidate_tag Stable; halt restores restore_tag after demoting bad_tag"
        required: true
        type: choice
        default: promote
        options:
          - promote
          - halt
      candidate_tag:
        description: "Promote only: exact vX.Y.Z prerelease tag"
        required: false
        type: string
        default: ""
      bad_tag:
        description: "Halt only: exact current Stable vX.Y.Z tag"
        required: false
        type: string
        default: ""
      restore_tag:
        description: "Halt only: exact derived prior Stable vX.Y.Z tag"
        required: false
        type: string
        default: ""
      linux_runner:
        description: "Runner to use for Stable release control"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - depot
          - github-hosted
          - self-hosted
      codex_model:
        description: "Promote only: Codex model for the combined Stable release notes"
        required: true
        default: gpt-5.6-terra
      codex_reasoning_effort:
        description: "Promote only: Codex reasoning effort for the combined Stable release notes"
        required: true
        type: choice
        default: xhigh
        options:
          - low
          - medium
          - high
          - xhigh
      notes_dry_run:
        description: "Promote only: generate and upload the combined notes, then stop before any release mutation"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-mutation-lane
  cancel-in-progress: false

env:
  PUBLIC_RELEASES_REPO: ${{ github.repository }}
  HOMEBREW_TAP_REPO: aigentive/homebrew-ralphx

jobs:
  reconcile-authorities:
    name: Reconcile Stable GitHub and pointer authorities
    runs-on: ${{ fromJSON(inputs.linux_runner == 'depot' && '"depot-ubuntu-24.04"' || inputs.linux_runner == 'self-hosted' && '["self-hosted","Linux","X64","ralphx-release"]' || inputs.linux_runner == 'github-hosted' && '"ubuntu-latest"' || '"blacksmith-32vcpu-ubuntu-2404"') }}
    timeout-minutes: 20
    outputs:
      selected_tag: ${{ steps.control.outputs.selected_tag }}
      operation: ${{ steps.control.outputs.operation }}
    env:
      GH_TOKEN: ${{ github.token }}
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      CODEX_API_KEY: ${{ secrets.CODEX_API_KEY || secrets.OPENAI_API_KEY }}
      CONTROL_OPERATION: ${{ inputs.operation }}
      CONTROL_CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      CONTROL_BAD_TAG: ${{ inputs.bad_tag }}
      CONTROL_RESTORE_TAG: ${{ inputs.restore_tag }}
      STABLE_RELEASE_NOTES_MODEL: ${{ inputs.codex_model }}
      STABLE_RELEASE_NOTES_REASONING_EFFORT: ${{ inputs.codex_reasoning_effort }}
      STABLE_NOTES_DIR: ${{ github.workspace }}/stable-notes
    steps:
      - name: Checkout release automation
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          path: workflow-support

      - name: Preflight Homebrew credentials and tap access
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]] || {
            echo "Missing required secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          }
          echo "::add-mask::${HOMEBREW_TAP_TOKEN}"
          git ls-remote --exit-code \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" \
            refs/heads/main >/dev/null || {
              echo "Authenticated Homebrew tap main is unreadable." >&2
              exit 1
            }

      - name: Fetch release tags
        if: ${{ inputs.operation == 'promote' }}
        shell: bash
        working-directory: workflow-support
        run: |
          set -euo pipefail
          git fetch --force --tags origin

      - name: Resolve previous Stable baseline
        id: baseline
        if: ${{ inputs.operation == 'promote' }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "Missing GitHub token for Stable baseline resolution." >&2
            exit 1
          }
          from_stable_tag="$(bash workflow-support/scripts/resolve-stable-baseline.sh \
            --repo "${PUBLIC_RELEASES_REPO}" \
            --ceiling-tag "${CONTROL_CANDIDATE_TAG}")"
          if [[ -z "${from_stable_tag}" ]]; then
            echo "combine=false" >> "${GITHUB_OUTPUT}"
            echo "No previous Stable release below ${CONTROL_CANDIDATE_TAG}; promoting with the existing per-build release notes." >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          echo "combine=true" >> "${GITHUB_OUTPUT}"
          echo "from_stable_tag=${from_stable_tag}" >> "${GITHUB_OUTPUT}"
          echo "Combining release notes for ${from_stable_tag}..${CONTROL_CANDIDATE_TAG}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Setup Node.js
        if: ${{ inputs.operation == 'promote' && steps.baseline.outputs.combine == 'true' }}
        uses: actions/setup-node@v6
        with:
          node-version: "20"

      - name: Install Codex CLI
        if: ${{ inputs.operation == 'promote' && steps.baseline.outputs.combine == 'true' }}
        run: npm i -g @openai/codex

      - name: Generate combined Stable release notes
        if: ${{ inputs.operation == 'promote' && steps.baseline.outputs.combine == 'true' }}
        shell: bash
        env:
          FROM_STABLE_TAG: ${{ steps.baseline.outputs.from_stable_tag }}
        run: |
          set -euo pipefail
          if [[ -z "${CODEX_API_KEY:-}" ]]; then
            echo "Missing CODEX_API_KEY. Add repository secret CODEX_API_KEY, or OPENAI_API_KEY as a fallback." >&2
            exit 1
          fi
          mkdir -p "${STABLE_NOTES_DIR}"
          bash workflow-support/scripts/generate-stable-release-notes.sh \
            --candidate-tag "${CONTROL_CANDIDATE_TAG}" \
            --from-stable-tag "${FROM_STABLE_TAG}" \
            --model "${STABLE_RELEASE_NOTES_MODEL}" \
            --reasoning-effort "${STABLE_RELEASE_NOTES_REASONING_EFFORT}" \
            --output "${STABLE_NOTES_DIR}/combined-body.md"
          bash workflow-support/scripts/append-github-release-metadata.sh \
            --tag "${CONTROL_CANDIDATE_TAG}" \
            --previous-tag "${FROM_STABLE_TAG}" \
            --target "${CONTROL_CANDIDATE_TAG}" \
            --repo "${PUBLIC_RELEASES_REPO}" \
            --notes-file "${STABLE_NOTES_DIR}/combined-body.md"
          bash workflow-support/scripts/append-github-release-metadata.sh \
            --strip-only \
            --notes-file "${STABLE_NOTES_DIR}/combined-body.md" \
            --output "${STABLE_NOTES_DIR}/combined-updater.md"
          for required in combined-body.md combined-updater.md; do
            [[ -s "${STABLE_NOTES_DIR}/${required}" ]] || {
              echo "Combined Stable notes artifact is empty: ${required}" >&2
              exit 1
            }
          done
          echo "Generated combined Stable release notes for ${FROM_STABLE_TAG}..${CONTROL_CANDIDATE_TAG}." >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload combined Stable release notes
        if: ${{ inputs.operation == 'promote' && steps.baseline.outputs.combine == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: stable-release-notes-${{ inputs.candidate_tag }}
          path: stable-notes/
          if-no-files-found: error

      - name: Report notes dry run
        if: ${{ inputs.operation == 'promote' && inputs.notes_dry_run == true }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Notes dry run"
            echo ""
            echo "Combined Stable release notes were generated and uploaded as an artifact."
            echo "No release, updater pointer, or Homebrew state was changed."
            echo "Re-run with \`notes_dry_run=false\` to promote ${CONTROL_CANDIDATE_TAG}."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Validate and reconcile requested Stable state
        id: control
        if: ${{ inputs.operation != 'promote' || inputs.notes_dry_run != true }}
        shell: bash
        env:
          COMBINE_NOTES: ${{ steps.baseline.outputs.combine }}
        run: |
          set -euo pipefail
          [[ -n "${GH_TOKEN:-}" ]] || {
            echo "Missing GitHub token for Stable release control." >&2
            exit 1
          }
          control_args=(
            --operation "${CONTROL_OPERATION}"
            --candidate-tag "${CONTROL_CANDIDATE_TAG}"
            --bad-tag "${CONTROL_BAD_TAG}"
            --restore-tag "${CONTROL_RESTORE_TAG}"
            --repo "${PUBLIC_RELEASES_REPO}"
            --work-dir stable-control
            --output stable-control/result.env
          )
          if [[ "${CONTROL_OPERATION}" == "promote" && "${COMBINE_NOTES:-}" == "true" ]]; then
            control_args+=(
              --promote-body-notes-file "${STABLE_NOTES_DIR}/combined-body.md"
              --pointer-notes-file "${STABLE_NOTES_DIR}/combined-updater.md"
            )
          fi
          bash workflow-support/scripts/reconcile-stable-release-state.sh "${control_args[@]}"
          while IFS='=' read -r key value; do
            case "${key}" in
              selected_tag|operation)
                echo "${key}=${value}" >> "${GITHUB_OUTPUT}"
                ;;
              *)
                echo "Unexpected Stable control result field: ${key}" >&2
                exit 1
                ;;
            esac
          done < stable-control/result.env

      - name: Reconcile staged Stable Homebrew cask
        if: ${{ inputs.operation != 'promote' || inputs.notes_dry_run != true }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${HOMEBREW_TAP_TOKEN:-}" ]] || {
            echo "Missing required secret: HOMEBREW_TAP_TOKEN" >&2
            exit 1
          }
          echo "::add-mask::${HOMEBREW_TAP_TOKEN}"
          tag=""
          while IFS='=' read -r key value; do
            case "${key}" in
              selected_tag)
                tag="${value}"
                ;;
              operation)
                ;;
              *)
                echo "Unexpected Stable control result field: ${key}" >&2
                exit 1
                ;;
            esac
          done < stable-control/result.env
          [[ "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Stable control returned an invalid selected tag." >&2
            exit 1
          }
          bash workflow-support/scripts/reconcile-homebrew-cask.sh \
            --repo-url "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${HOMEBREW_TAP_REPO}.git" \
            --expected-cask stable-control/staged-homebrew-cask.rb \
            --tag "${tag}" \
            --work-dir stable-homebrew
