name: Release Publish

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: "Release build workflow run ID to publish artifacts from"
        required: true
      ref:
        description: "Git tag ref the build came from (for example v0.2.0 or refs/tags/v0.2.0)"
        required: true
      version:
        description: "Version to release (for example 0.2.0 or v0.2.0)"
        required: true
      linux_runner:
        description: "Runner to use for publish jobs"
        required: true
        type: choice
        default: blacksmith
        options:
          - blacksmith
          - depot
          - github-hosted
          - self-hosted
  workflow_run:
    workflows:
      - Release Build
    types:
      - completed

permissions:
  actions: read
  contents: write

concurrency:
  group: release-mutation-lane
  cancel-in-progress: false

env:
  PUBLIC_RELEASES_REPO: ${{ github.repository }}

jobs:
  metadata:
    name: Resolve publish metadata
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') }}
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'depot' && '"depot-ubuntu-24.04"' || github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'self-hosted' && '["self-hosted","Linux","X64","ralphx-release"]' || github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'github-hosted' && '"ubuntu-latest"' || '"blacksmith-32vcpu-ubuntu-2404"') }}
    outputs:
      source_run_id: ${{ steps.run_id.outputs.source_run_id }}
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      release_name: ${{ steps.meta.outputs.release_name }}
      draft: ${{ steps.meta.outputs.draft }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Resolve source build run ID
        id: run_id
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_SOURCE_RUN_ID: ${{ github.event.inputs.source_run_id }}
          WORKFLOW_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            source_run_id="${DISPATCH_SOURCE_RUN_ID}"
          else
            source_run_id="${WORKFLOW_RUN_ID}"
          fi

          if [[ ! "${source_run_id}" =~ ^[1-9][0-9]*$ ]]; then
            echo "Release build run ID must be a positive decimal run ID" >&2
            exit 1
          fi

          echo "source_run_id=${source_run_id}" >> "${GITHUB_OUTPUT}"

      - name: Download release metadata artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.run_id.outputs.source_run_id }}
          name: release-metadata
          path: release-metadata

      - name: Resolve publish metadata
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.inputs.ref }}
          DISPATCH_VERSION: ${{ github.event.inputs.version }}
          SOURCE_RUN_ID: ${{ steps.run_id.outputs.source_run_id }}
        run: |
          set -euo pipefail

          data_file="release-metadata/release-metadata.json"
          if [[ ! -f "${data_file}" ]]; then
            echo "Release metadata artifact missing from build run ${SOURCE_RUN_ID}" >&2
            exit 1
          fi

          version="$(jq -r '.version' "${data_file}")"
          tag="$(jq -r '.tag' "${data_file}")"
          release_name="$(jq -r '.release_name' "${data_file}")"

          for value_name in version tag release_name; do
            if [[ -z "${!value_name:-}" || "${!value_name}" == "null" ]]; then
              echo "Release metadata field ${value_name} is missing in ${data_file}" >&2
              exit 1
            fi
          done
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ || "${tag}" != "v${version}" ]]; then
            echo "Build metadata must contain matching exact X.Y.Z version and vX.Y.Z tag." >&2
            exit 1
          fi
          if [[ "${release_name}" != "RalphX.app ${tag}" ]]; then
            echo "Build metadata release_name must equal RalphX.app plus validated tag ${tag}." >&2
            exit 1
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            raw_ref="${DISPATCH_REF}"
            raw_version="${DISPATCH_VERSION}"
            requested_version="${raw_version#v}"
            if [[ ! "${requested_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Release version must be an exact X.Y.Z or vX.Y.Z value" >&2
              exit 1
            fi

            requested_tag="v${requested_version}"
            normalized_ref="${raw_ref#refs/tags/}"
            if [[ "${normalized_ref}" != "${requested_tag}" ]]; then
              echo "Release ref must match the requested version tag. Expected ${requested_tag}, got ${raw_ref}." >&2
              exit 1
            fi

            if [[ "${requested_tag}" != "${tag}" || "${requested_version}" != "${version}" ]]; then
              echo "Requested release ${requested_tag} does not match build metadata ${tag} from run ${SOURCE_RUN_ID}." >&2
              exit 1
            fi

          fi

          draft="$(jq -r '.draft' "${data_file}")"
          prerelease="$(jq -r '.prerelease' "${data_file}")"
          for value_name in draft prerelease; do
            if [[ -z "${!value_name:-}" || "${!value_name}" == "null" ]]; then
              echo "Release metadata field ${value_name} is missing in ${data_file}" >&2
              exit 1
            fi
          done

          if [[ "${draft}" != "false" || "${prerelease}" != "true" ]]; then
            echo "Release Publish only accepts prerelease build metadata." >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
            echo "release_name=${release_name}"
            echo "draft=${draft}"
            echo "prerelease=${prerelease}"
          } >> "${GITHUB_OUTPUT}"

  publish-release:
    name: Publish public release assets
    needs: metadata
    runs-on: ${{ fromJSON(github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'depot' && '"depot-ubuntu-24.04"' || github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'self-hosted' && '["self-hosted","Linux","X64","ralphx-release"]' || github.event_name == 'workflow_dispatch' && inputs.linux_runner == 'github-hosted' && '"ubuntu-latest"' || '"blacksmith-32vcpu-ubuntu-2404"') }}
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate publishing environment
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "Missing GitHub token for release publishing" >&2
            exit 1
          fi

      - name: Checkout release automation
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow-support

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}
          path: release-assets

      - name: Download release metadata artifact
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.metadata.outputs.source_run_id }}
          name: release-metadata
          path: release-metadata

      - name: Build release metadata files
        shell: bash
        env:
          SOURCE_RUN_ID: ${{ needs.metadata.outputs.source_run_id }}
          VERSION: ${{ needs.metadata.outputs.version }}
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
        run: |
          set -euo pipefail

          # shellcheck disable=SC2153
          version="${VERSION}"
          tag="${TAG}"
          # shellcheck disable=SC2153
          release_name="${RELEASE_NAME}"
          if [[ ! -f release-metadata/release-notes.md ]]; then
            echo "Release notes artifact missing from build run ${SOURCE_RUN_ID}" >&2
            exit 1
          fi
          cp release-metadata/release-notes.md release-assets/release-notes.md
          if [[ -f release-metadata/github-release-notes.md ]]; then
            cp release-metadata/github-release-notes.md release-assets/github-release-notes.md
          else
            cp release-assets/release-notes.md release-assets/github-release-notes.md
          fi

          strip_release_heading() {
            local notes_path="$1"
            local first_nonempty
            first_nonempty="$(awk 'NF { print; exit }' "${notes_path}")"
            if [[ "${first_nonempty}" != "# ${release_name}" && "${first_nonempty}" != "# ${tag}" ]]; then
              return 0
            fi

            tmp_notes="$(mktemp)"
            EXPECTED_RELEASE_HEADING="# ${release_name}" EXPECTED_TAG_HEADING="# ${tag}" \
              awk '
                BEGIN {dropping=1; heading_removed=0}
                dropping && !heading_removed && $0 ~ /^[[:space:]]*$/ {next}
                dropping && !heading_removed && ($0 == ENVIRON["EXPECTED_RELEASE_HEADING"] || $0 == ENVIRON["EXPECTED_TAG_HEADING"]) {heading_removed=1; next}
                dropping && heading_removed && $0 ~ /^[[:space:]]*$/ {next}
                {dropping=0; print}
              ' "${notes_path}" > "${tmp_notes}"
            mv "${tmp_notes}" "${notes_path}"
          }

          strip_release_heading release-assets/release-notes.md
          strip_release_heading release-assets/github-release-notes.md

          source_asset_dir="publication-assets"
          nightly_asset_dir="nightly-assets"
          manifest_dir="updater-manifests"
          mkdir -p "${source_asset_dir}" "${nightly_asset_dir}" "${manifest_dir}"

          source_asset_names=(
            "RalphX_${version}_aarch64.app.tar.gz"
            "RalphX_${version}_aarch64.app.tar.gz.sig"
            "RalphX_${version}_aarch64.dmg"
            "RalphX_${version}_x86_64.app.tar.gz"
            "RalphX_${version}_x86_64.app.tar.gz.sig"
            "RalphX_${version}_x86_64.dmg"
          )
          source_asset_paths=(
            "release-assets/release-aarch64/RalphX_${version}_aarch64.app.tar.gz"
            "release-assets/release-aarch64/RalphX_${version}_aarch64.app.tar.gz.sig"
            "release-assets/release-aarch64/RalphX_${version}_aarch64.dmg"
            "release-assets/release-x86_64/RalphX_${version}_x86_64.app.tar.gz"
            "release-assets/release-x86_64/RalphX_${version}_x86_64.app.tar.gz.sig"
            "release-assets/release-x86_64/RalphX_${version}_x86_64.dmg"
          )

          for path in "${source_asset_paths[@]}"; do
            if [[ ! -f "${path}" ]]; then
              echo "Required release asset missing: ${path}" >&2
              exit 1
            fi
          done
          for index in "${!source_asset_names[@]}"; do
            cp "${source_asset_paths[${index}]}" "${source_asset_dir}/${source_asset_names[${index}]}"
          done

          (
            cd "${source_asset_dir}"
            shasum -a 256 \
              "RalphX_${version}_aarch64.dmg" \
              "RalphX_${version}_x86_64.dmg" \
              "RalphX_${version}_aarch64.app.tar.gz" \
              "RalphX_${version}_x86_64.app.tar.gz" > checksums.txt
          )

          bash workflow-support/scripts/render-updater-channel-manifests.sh \
            --tag "${tag}" \
            --notes-file release-assets/release-notes.md \
            --aarch64-signature "${source_asset_dir}/RalphX_${version}_aarch64.app.tar.gz.sig" \
            --x86_64-signature "${source_asset_dir}/RalphX_${version}_x86_64.app.tar.gz.sig" \
            --pub-date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --channel nightly \
            --output-dir "${manifest_dir}"
          cp "${manifest_dir}/latest.json" "${source_asset_dir}/latest.json"
          cp "${manifest_dir}/latest-aarch64.json" "${nightly_asset_dir}/latest-aarch64.json"
          cp "${manifest_dir}/latest-x86_64.json" "${nightly_asset_dir}/latest-x86_64.json"

          bash workflow-support/scripts/validate-release-promotion.sh \
            "${tag}" "${source_asset_dir}" "${nightly_asset_dir}" nightly

      - name: Create or update public release
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_NAME: ${{ needs.metadata.outputs.release_name }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail

          tag="${TAG}"
          # shellcheck disable=SC2153
          release_name="${RELEASE_NAME}"
          # shellcheck disable=SC2153
          version="${VERSION}"
          source_asset_dir="publication-assets"
          asset_files=(
            "${source_asset_dir}/RalphX_${version}_aarch64.app.tar.gz"
            "${source_asset_dir}/RalphX_${version}_aarch64.app.tar.gz.sig"
            "${source_asset_dir}/RalphX_${version}_aarch64.dmg"
            "${source_asset_dir}/RalphX_${version}_x86_64.app.tar.gz"
            "${source_asset_dir}/RalphX_${version}_x86_64.app.tar.gz.sig"
            "${source_asset_dir}/RalphX_${version}_x86_64.dmg"
            "${source_asset_dir}/checksums.txt"
            "${source_asset_dir}/latest.json"
          )

          if gh release view "${tag}" --repo "${PUBLIC_RELEASES_REPO}" >/dev/null 2>&1; then
            release_api="$(gh api "repos/${PUBLIC_RELEASES_REPO}/releases/tags/${tag}")"
            if ! jq -e 'has("immutable") and (.immutable | type == "boolean") and (.immutable == false)' \
              <<<"${release_api}" >/dev/null; then
              echo "Existing release ${tag} is immutable or missing the immutable API field." >&2
              exit 1
            fi
            release_state="$(gh release view "${tag}" --repo "${PUBLIC_RELEASES_REPO}" --json isDraft,isPrerelease --jq '[.isDraft, .isPrerelease] | @tsv')"
            if [[ "${release_state}" != $'false\ttrue' ]]; then
              echo "Existing release ${tag} is not a published prerelease; Stable Release Control owns stable state." >&2
              exit 1
            fi
            gh release edit "${tag}" \
              --repo "${PUBLIC_RELEASES_REPO}" \
              --title "${release_name}" \
              --notes-file release-assets/github-release-notes.md \
              --draft=false \
              --prerelease \
              --latest=false

            gh release upload "${tag}" \
              --repo "${PUBLIC_RELEASES_REPO}" \
              --clobber \
              "${asset_files[@]}"
            exit 0
          fi

          create_args=(
            gh release create "${tag}"
            --repo "${PUBLIC_RELEASES_REPO}"
            --title "${release_name}"
            --notes-file release-assets/github-release-notes.md
            --prerelease
            --latest=false
          )
          create_args+=("${asset_files[@]}")
          "${create_args[@]}"

      - name: Reconcile and verify fixed Nightly pointer release
        shell: bash
        env:
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail

          bash workflow-support/scripts/reconcile-nightly-updater-pointers.sh \
            --repo "${PUBLIC_RELEASES_REPO}" \
            --candidate-tag "${TAG}" \
            --source-dir publication-assets \
            --pointer-dir nightly-assets \
            --work-dir nightly-pointer-control
