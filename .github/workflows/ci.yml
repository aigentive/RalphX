name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXTEST_VERSION: "0.9.133"
  # Deep async poll chains (repair -> workspace-review -> chat send) exceed the
  # 2 MiB std default test-thread stack in unoptimized builds; give libtest/nextest
  # worker threads real headroom instead of sitting at the overflow boundary.
  RUST_MIN_STACK: "8388608"

jobs:
  changes:
    name: Detect CI scope
    runs-on: ubuntu-latest
    outputs:
      run_automation: ${{ steps.decide.outputs.run_automation }}
      run_plugins: ${{ steps.decide.outputs.run_plugins }}
      run_rust: ${{ steps.decide.outputs.run_rust }}
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
      run_visual: ${{ steps.decide.outputs.run_visual }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            automation:
              - '.github/workflows/**'
              - '.github/actions/**'
              - '.github/codeql/**'
              - '.github/dependabot.yml'
              - 'CLAUDE.md'
              - '**/CLAUDE.md'
              - '.claude/rules/**'
              - 'scripts/test-rust-fast.sh'
              - 'scripts/validate-claude-rules.py'
              - 'scripts/tests/test-ci-rust-full-integration-targets.sh'
              - 'scripts/tests/test-coverage-rust-shards.sh'
              - 'scripts/tests/test-claude-rules-activation.py'
              - 'scripts/build-prod-release.sh'
              - 'scripts/render-homebrew-cask.sh'
              - 'scripts/reconcile-homebrew-cask.sh'
              - 'scripts/render-updater-channel-manifests.sh'
              - 'scripts/validate-release-promotion.sh'
              - 'scripts/reconcile-stable-release-state.sh'
              - 'scripts/reconcile-nightly-updater-pointers.sh'
              - 'scripts/verify-public-updater-pointers.sh'
              - 'scripts/tests/test-daily-release-notes-from-override.sh'
              - 'scripts/tests/test-updater-channel-manifests.sh'
              - 'scripts/tests/test-release-promotion.sh'
              - 'scripts/tests/test-reconcile-homebrew-cask.sh'
              - 'scripts/tests/test-stable-release-state.sh'
            plugins:
              - 'plugins/app/ralphx-external-mcp/**'
              - 'plugins/app/ralphx-mcp-server/**'
              - 'scripts/prepare-release-runtime.sh'
            rust:
              - '.cargo/**'
              - '.github/actions/**'
              - 'src-tauri/**'
              - 'rust-toolchain.toml'
              - 'scripts/bench-rust-build.sh'
              - 'scripts/baselines/layering.json'
              - 'scripts/ci-install-linux-deps.sh'
              - 'scripts/check-layering.py'
              - 'scripts/check-rust-test-features.py'
              - 'scripts/test-rust-fast.sh'
              - 'scripts/validate_sqlite_migrations.py'
            frontend:
              - 'frontend/**'
            visual:
              - 'frontend/**'
              - 'src-tauri/Cargo.lock'
              - 'src-tauri/Cargo.toml'
              - 'src-tauri/src/application/runtime_wiring.rs'
              - 'src-tauri/tauri.conf.json'

      - name: Decide CI scope
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            {
              echo "run_automation=true"
              echo "run_plugins=true"
              echo "run_rust=true"
              echo "run_frontend=true"
              echo "run_visual=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            {
              echo "run_automation=${{ steps.filter.outputs.automation }}"
              echo "run_plugins=true"
              echo "run_rust=true"
              echo "run_frontend=true"
              echo "run_visual=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "run_automation=${{ steps.filter.outputs.automation }}"
            echo "run_plugins=${{ steps.filter.outputs.plugins }}"
            echo "run_rust=${{ steps.filter.outputs.rust }}"
            echo "run_frontend=${{ steps.filter.outputs.frontend }}"
            echo "run_visual=${{ steps.filter.outputs.visual }}"
          } >> "${GITHUB_OUTPUT}"

  automation-config:
    name: Automation Config
    needs: changes
    if: needs.changes.outputs.run_automation == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate workflow and automation YAML
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t yaml_files < <(
            git ls-files \
              '.github/workflows/*.yml' \
              '.github/workflows/*.yaml' \
              '.github/actions/*/action.yml' \
              '.github/codeql/*.yml' \
              '.github/codeql/*.yaml' \
              '.github/dependabot.yml' \
              '.github/dependabot.yaml'
          )

          if [[ "${#yaml_files[@]}" -eq 0 ]]; then
            exit 0
          fi

          ruby -e 'require "yaml"; ARGV.each { |path| YAML.load_file(path) }' "${yaml_files[@]}"
          ACTIONLINT_VERSION="1.7.8"
          ACTIONLINT_SHA256="be92c2652ab7b6d08425428797ceabeb16e31a781c07bc388456b4e592f3e36a"
          actionlint_archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          actionlint_dir="$(mktemp -d)"
          trap 'rm -rf "${actionlint_dir}"' EXIT
          curl --fail --location --silent --show-error \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${actionlint_archive}" \
            --output "${actionlint_dir}/${actionlint_archive}"
          printf '%s  %s\n' "${ACTIONLINT_SHA256}" "${actionlint_dir}/${actionlint_archive}" | sha256sum --check --
          tar -xzf "${actionlint_dir}/${actionlint_archive}" -C "${actionlint_dir}" actionlint
          "${actionlint_dir}/actionlint"

      - name: Validate Rust full integration target scope
        shell: bash
        run: bash scripts/tests/test-ci-rust-full-integration-targets.sh

      - name: Validate Rust full integration progress reporting
        shell: bash
        run: bash scripts/tests/test-ci-rust-full-integration-heartbeat.sh

      - name: Validate Rust coverage shard topology
        shell: bash
        run: bash scripts/tests/test-coverage-rust-shards.sh

      - name: Validate Claude rule loading
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate-claude-rules.py
          python3 scripts/tests/test-claude-rules-activation.py

      - name: Validate release scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/build-prod-release.sh
          bash -n scripts/render-homebrew-cask.sh
          bash -n scripts/reconcile-homebrew-cask.sh
          bash -n scripts/render-updater-channel-manifests.sh
          bash -n scripts/validate-release-promotion.sh
          bash -n scripts/reconcile-stable-release-state.sh
          bash -n scripts/reconcile-nightly-updater-pointers.sh
          bash -n scripts/verify-public-updater-pointers.sh
          bash scripts/tests/test-daily-release-notes-from-override.sh
          bash scripts/tests/test-updater-channel-manifests.sh
          bash scripts/tests/test-release-promotion.sh
          bash scripts/tests/test-reconcile-homebrew-cask.sh
          bash scripts/tests/test-stable-release-state.sh

  tauri-package-alignment:
    name: Tauri Package Alignment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'

      - name: Check JavaScript and Rust Tauri package alignment
        run: node scripts/check-tauri-package-alignment.mjs .

  rust-ipc-contracts:
    name: Rust IPC Contracts
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_PROFILE_TEST_DEBUG: "1"
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-test-deps
          save-if: "false"

      - name: Validate SQLite migrations
        run: |
          python3 scripts/validate_sqlite_migrations.py

      - name: Validate Rust test feature gates
        run: |
          python3 scripts/check-rust-test-features.py

      - name: Validate Rust layering ratchet
        run: |
          python3 scripts/check-layering.py

      - name: Run IPC contract tests
        run: |
          cargo nextest run \
            --manifest-path src-tauri/Cargo.toml \
            --profile ci \
            --features test-utils \
            --test suite_ipc_commands \
            ipc_contract

  rust-lib-nextest-archive:
    name: Rust Lib Tests Archive
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_TEST_DEBUG: "1"
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-test-deps
          save-if: "false"

      - name: Build Rust lib tests archive
        run: |
          cargo nextest archive \
            --manifest-path src-tauri/Cargo.toml \
            --lib \
            --profile ci \
            --features test-utils \
            --archive-file rust-lib-tests.tar.zst

      - name: Upload Rust lib tests archive
        uses: actions/upload-artifact@v7
        with:
          name: rust-lib-tests-nextest-archive
          path: rust-lib-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  rust-lib-tests:
    name: Rust Lib Tests (Shard ${{ matrix.shard }}/4)
    needs:
      - changes
      - rust-lib-nextest-archive
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Download Rust lib tests archive
        uses: actions/download-artifact@v8
        with:
          name: rust-lib-tests-nextest-archive
          path: .

      - name: Run Rust lib tests shard ${{ matrix.shard }}/4
        run: |
          cargo nextest run \
            --archive-file rust-lib-tests.tar.zst \
            --workspace-remap "${GITHUB_WORKSPACE}/src-tauri" \
            --profile ci \
            --partition hash:${{ matrix.shard }}/4

      - name: Upload Rust lib test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-lib-tests-junit-${{ matrix.shard }}-of-4
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  rust-clippy-min:
    name: Rust Clippy (no default features)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-clippy-min

      - name: Run clippy without default features
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --lib \
            --bins \
            --no-default-features \
            -- -D warnings

  rust-clippy-full:
    name: Rust Clippy (all features)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0
          components: clippy

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-clippy-full

      - name: Run clippy with all targets and all features
        run: |
          cargo clippy \
            --manifest-path src-tauri/Cargo.toml \
            --all-targets \
            --all-features \
            -- -D warnings

  rust-doctests:
    name: Rust Doctests
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'

      - name: Run Rust doctests
        run: |
          cargo test --manifest-path src-tauri/Cargo.toml --workspace --doc

  rust-integration-nextest-archive:
    name: Rust Integration Tests Archive
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      CARGO_PROFILE_TEST_DEBUG: "1"
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-test-deps
          cache-on-failure: true
          save-if: "true"

      - name: Build Rust integration tests archive
        run: |
          bash scripts/test-rust-fast.sh full-integration-archive rust-integration-tests.tar.zst

      - name: Upload Rust integration tests archive
        uses: actions/upload-artifact@v7
        with:
          name: rust-integration-tests-nextest-archive
          path: rust-integration-tests.tar.zst
          if-no-files-found: error
          retention-days: 1

  rust-full-integration:
    name: Rust Full Integration (Shard ${{ matrix.shard }}/3)
    needs:
      - changes
      - rust-integration-nextest-archive
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: nextest@${{ env.NEXTEST_VERSION }}

      - name: Download Rust integration tests archive
        uses: actions/download-artifact@v8
        with:
          name: rust-integration-tests-nextest-archive
          path: .

      - name: Run Rust integration tests shard ${{ matrix.shard }}/3
        run: |
          heartbeat() {
            while true; do
              printf '[rust-full-integration] %s still running\n' \
                "$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
              sleep 60
            done
          }

          heartbeat &
          heartbeat_pid=$!

          cleanup() {
            kill "${heartbeat_pid}" 2>/dev/null || true
            wait "${heartbeat_pid}" 2>/dev/null || true
          }
          trap cleanup EXIT

          cargo nextest run \
            --archive-file rust-integration-tests.tar.zst \
            --workspace-remap "${GITHUB_WORKSPACE}/src-tauri" \
            --profile ci \
            --partition slice:${{ matrix.shard }}/3

      - name: Upload Rust integration test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rust-integration-tests-junit-${{ matrix.shard }}-of-3
          path: src-tauri/target/nextest/ci/junit.xml
          if-no-files-found: warn
          retention-days: 7

  rust-macos-build:
    name: Rust macOS Build
    needs: changes
    # Temporarily disabled: current PR macOS runners make this check too slow to be feasible.
    # Keep the job definition and rust-tests dependency so it can be re-enabled by restoring
    # the original condition: needs.changes.outputs.run_rust == 'true'
    if: ${{ false && needs.changes.outputs.run_rust == 'true' }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'

      - name: Build macOS app without bundling
        run: CI=false npm run tauri -- build --no-bundle
        working-directory: frontend

  rust-tests:
    name: Rust Tests
    needs:
      - changes
      - rust-ipc-contracts
      - rust-lib-nextest-archive
      - rust-lib-tests
      - rust-clippy-min
      - rust-clippy-full
      - rust-doctests
      - rust-integration-nextest-archive
      - rust-full-integration
      - rust-macos-build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finalize Rust status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "CI scope detection failed for Rust." >&2
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_rust }}" != "true" ]]; then
            echo "No Rust-relevant changes detected for this pull request; skipping Rust suite."
            exit 0
          fi

          for job_result in \
            "${{ needs.rust-ipc-contracts.result }}" \
            "${{ needs.rust-lib-nextest-archive.result }}" \
            "${{ needs.rust-lib-tests.result }}" \
            "${{ needs.rust-clippy-min.result }}" \
            "${{ needs.rust-clippy-full.result }}" \
            "${{ needs.rust-doctests.result }}" \
            "${{ needs.rust-integration-nextest-archive.result }}" \
            "${{ needs.rust-full-integration.result }}" \
            "${{ needs.rust-macos-build.result }}"; do
            if [[ "${job_result}" != "success" && "${job_result}" != "skipped" ]]; then
              echo "Rust suite result: ${job_result}" >&2
              exit 1
            fi
          done

  plugin-checks:
    name: Plugin Checks (${{ matrix.package_name }})
    needs: changes
    if: needs.changes.outputs.run_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: External MCP
            package_dir: plugins/app/ralphx-external-mcp
            package_lock: plugins/app/ralphx-external-mcp/package-lock.json
          - package_name: Internal MCP
            package_dir: plugins/app/ralphx-mcp-server
            package_lock: plugins/app/ralphx-mcp-server/package-lock.json
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package_lock }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package_dir }}

      - name: TypeScript check
        shell: bash
        working-directory: ${{ matrix.package_dir }}
        run: |
          set -euo pipefail
          if node -e "const pkg = require('./package.json'); process.exit(pkg.scripts && pkg.scripts.typecheck ? 0 : 1)"; then
            npm run typecheck
          else
            echo "No typecheck script for ${PWD}; skipping."
          fi

      - name: Build plugin package
        run: npm run build
        working-directory: ${{ matrix.package_dir }}

      - name: Verify generated plugin output is committed
        run: |
          if [[ -n "$(git status --short -- build)" ]]; then
            git status --short -- build
            exit 1
          fi
        working-directory: ${{ matrix.package_dir }}

      - name: Run plugin tests
        run: npm test
        working-directory: ${{ matrix.package_dir }}

  plugin-tests:
    name: Plugin Tests
    needs:
      - changes
      - plugin-checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finalize plugin status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "CI scope detection failed for plugins." >&2
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_plugins }}" != "true" ]]; then
            echo "No plugin-relevant changes detected for this pull request; skipping plugin suite."
            exit 0
          fi

          if [[ "${{ needs.plugin-checks.result }}" != "success" ]]; then
            echo "Plugin suite result: ${{ needs.plugin-checks.result }}" >&2
            exit 1
          fi

  frontend-quality:
    name: Frontend Quality
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: TypeScript check
        run: npm run typecheck
        working-directory: frontend

      - name: Lint
        run: npm run lint
        working-directory: frontend

      - name: Build frontend bundle
        run: npm exec vite build
        working-directory: frontend

  frontend-tests-shard-1:
    name: Frontend Tests (Shard 1/2)
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests shard 1/2
        run: npm run test:run -- --shard=1/2
        working-directory: frontend

  frontend-tests-shard-2:
    name: Frontend Tests (Shard 2/2)
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend tests shard 2/2
        run: npm run test:run -- --shard=2/2
        working-directory: frontend

  frontend-tests:
    name: Frontend Tests
    needs:
      - changes
      - frontend-quality
      - frontend-tests-shard-1
      - frontend-tests-shard-2
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finalize frontend status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "CI scope detection failed for frontend." >&2
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_frontend }}" != "true" ]]; then
            echo "No frontend-relevant changes detected for this pull request; skipping frontend suite."
            exit 0
          fi

          for job_result in \
            "${{ needs.frontend-quality.result }}" \
            "${{ needs.frontend-tests-shard-1.result }}" \
            "${{ needs.frontend-tests-shard-2.result }}"; do
            if [[ "${job_result}" != "success" ]]; then
              echo "Frontend suite result: ${job_result}" >&2
              exit 1
            fi
          done

  frontend-visual-snapshots:
    name: Frontend Visual Snapshots
    needs: changes
    if: needs.changes.outputs.run_visual == 'true'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Install Playwright browser
        run: npx playwright install chromium
        working-directory: frontend

      - name: Run visual snapshots
        run: npm run test:visual
        working-directory: frontend

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-visual-report
          path: frontend/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  frontend-visual-tests:
    name: Frontend Visual Tests
    needs:
      - changes
      - frontend-visual-snapshots
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Finalize visual status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "CI scope detection failed for visual tests." >&2
            exit 1
          fi

          if [[ "${{ needs.changes.outputs.run_visual }}" != "true" ]]; then
            echo "No visual-relevant changes detected for this pull request; skipping visual suite."
            exit 0
          fi

          if [[ "${{ needs.frontend-visual-snapshots.result }}" != "success" ]]; then
            echo "Visual suite result: ${{ needs.frontend-visual-snapshots.result }}" >&2
            exit 1
          fi
