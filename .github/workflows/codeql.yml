name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pull-requests: read
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect CodeQL scope
    runs-on: ubuntu-latest
    outputs:
      run_actions: ${{ steps.decide.outputs.run_actions }}
      run_javascript: ${{ steps.decide.outputs.run_javascript }}
      run_rust: ${{ steps.decide.outputs.run_rust }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          predicate-quantifier: every
          filters: |
            actions:
              - added|modified|deleted:
                  - '.github/workflows/**'
                  - '.github/codeql/**'
            javascript:
              - added|modified|deleted:
                  - 'frontend/**'
                  - 'plugins/app/ralphx-external-mcp/**'
                  - 'plugins/app/ralphx-mcp-server/**'
              - '!**/CLAUDE.md'
            rust:
              - added|modified|deleted:
                  - 'src-tauri/**'
                  - 'rust-toolchain.toml'
              - '!**/CLAUDE.md'

      - name: Decide CodeQL scope
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" ]]; then
            {
              echo "run_actions=true"
              echo "run_javascript=true"
              echo "run_rust=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          {
            echo "run_actions=${{ steps.filter.outputs.actions }}"
            echo "run_javascript=${{ steps.filter.outputs.javascript }}"
            echo "run_rust=${{ steps.filter.outputs.rust }}"
          } >> "${GITHUB_OUTPUT}"

  analyze-actions:
    name: Analyze (actions)
    needs: changes
    if: needs.changes.outputs.run_actions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: actions
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:actions

  analyze-javascript:
    name: Analyze (javascript-typescript)
    needs: changes
    if: needs.changes.outputs.run_javascript == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: javascript-typescript
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:javascript-typescript

  analyze-rust:
    name: Analyze (rust)
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: /language:rust

  code-scanning-gate:
    name: Code scanning gate
    needs:
      - changes
      - analyze-actions
      - analyze-javascript
      - analyze-rust
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && always() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: read
    steps:
      - name: Finalize CodeQL analysis status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "CodeQL scope detection failed." >&2
            exit 1
          fi

          for job_result in \
            "${{ needs.analyze-actions.result }}" \
            "${{ needs.analyze-javascript.result }}" \
            "${{ needs.analyze-rust.result }}"; do
            if [[ "${job_result}" != "success" && "${job_result}" != "skipped" ]]; then
              echo "CodeQL analysis result: ${job_result}" >&2
              exit 1
            fi
          done

      - name: Fail on open medium+ CodeQL alerts for this pull request
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.base_ref || format('refs/heads/{0}', github.event.pull_request.base.ref) }}
          PR_REF: ${{ github.event_name == 'merge_group' && github.ref || format('refs/pull/{0}/merge', github.event.pull_request.number) }}
        shell: bash
        run: |
          set -euo pipefail

          fetch_alerts() {
            local ref="$1"
            gh api --paginate \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/code-scanning/alerts?state=open&ref=${ref}&per_page=100" \
              | jq -s 'add // []'
          }

          pr_alerts_json="$(fetch_alerts "${PR_REF}")"
          base_alert_numbers="$(fetch_alerts "${BASE_REF}" | jq '
            [
              .[]
              | select(.tool.name == "CodeQL")
              | select((.rule.security_severity_level // "") as $level | $level == "medium" or $level == "high" or $level == "critical")
              | .number
            ]
            | unique
          ')"

          medium_or_higher_alerts="$(jq --argjson base_alert_numbers "${base_alert_numbers}" '
            [
              .[]
              | select(.tool.name == "CodeQL")
              | select((.rule.security_severity_level // "") as $level | $level == "medium" or $level == "high" or $level == "critical")
              | select((.number as $number | $base_alert_numbers | index($number)) | not)
              | {
                  number,
                  rule: .rule.id,
                  security_severity_level: .rule.security_severity_level,
                  html_url
                }
            ]
          ' <<< "${pr_alerts_json}")"

          alert_count="$(jq 'length' <<< "${medium_or_higher_alerts}")"
          if [[ "${alert_count}" -gt 0 ]]; then
            echo "New open medium+ CodeQL alerts found for ${PR_REF} compared with ${BASE_REF}:" >&2
            jq -r '.[] | "- #\(.number) [\(.security_severity_level)] \(.rule) \(.html_url)"' <<< "${medium_or_higher_alerts}" >&2
            exit 1
          fi

          echo "No new open medium+ CodeQL alerts found for ${PR_REF} compared with ${BASE_REF}."
