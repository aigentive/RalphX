name: Coverage Reports

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

permissions:
  statuses: read
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # Coverage instrumentation inflates unoptimized async poll-chain stack frames
  # past the 2 MiB std default test-thread stack; match ci.yml headroom.
  RUST_MIN_STACK: "8388608"

jobs:
  changes:
    name: Detect coverage scope
    runs-on: ubuntu-latest
    outputs:
      run_plugins: ${{ steps.decide.outputs.run_plugins }}
      run_rust: ${{ steps.decide.outputs.run_rust }}
      run_frontend: ${{ steps.decide.outputs.run_frontend }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Detect changed paths
        id: filter
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          list-files: shell
          predicate-quantifier: every
          filters: |
            plugins:
              - added|modified|deleted:
                  - '.github/workflows/coverage.yml'
                  - 'scripts/summarize-coverage.mjs'
                  - 'plugins/app/ralphx-external-mcp/**'
                  - 'plugins/app/ralphx-mcp-server/**'
              - '!**/CLAUDE.md'
            rust:
              - added|modified|deleted:
                  - '.cargo/**'
                  - '.github/actions/**'
                  - '.github/workflows/coverage.yml'
                  - 'scripts/summarize-coverage.mjs'
                  - 'scripts/bench-rust-build.sh'
                  - 'scripts/check-rust-test-features.py'
                  - 'scripts/test-rust-fast.sh'
                  - 'src-tauri/**'
                  - 'rust-toolchain.toml'
                  - 'scripts/ci-install-linux-deps.sh'
                  - 'scripts/validate_sqlite_migrations.py'
              - '!**/CLAUDE.md'
            frontend:
              - added|modified|deleted:
                  - '.github/workflows/coverage.yml'
                  - 'scripts/summarize-coverage.mjs'
                  - 'frontend/**'
              - '!**/CLAUDE.md'

      - name: Decide coverage scope
        id: decide
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            {
              echo "run_plugins=true"
              echo "run_rust=true"
              echo "run_frontend=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            {
              echo "run_plugins=true"
              echo "run_rust=true"
              echo "run_frontend=true"
            } >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          is_dependency_manifest() {
            case "$1" in
              frontend/package.json|\
              frontend/package-lock.json|\
              plugins/app/ralphx-external-mcp/package.json|\
              plugins/app/ralphx-external-mcp/package-lock.json|\
              plugins/app/ralphx-mcp-server/package.json|\
              plugins/app/ralphx-mcp-server/package-lock.json|\
              src-tauri/Cargo.lock|\
              src-tauri/Cargo.toml|\
              src-tauri/crates/*/Cargo.toml)
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          has_coverage_relevant_file() {
            local files="$1"
            local file

            for file in ${files}; do
              if ! is_dependency_manifest "${file}"; then
                return 0
              fi
            done

            return 1
          }

          decide_coverage_scope() {
            local matched="$1"
            local files="$2"

            if [[ "${matched}" == "true" ]] && has_coverage_relevant_file "${files}"; then
              echo "true"
            else
              echo "false"
            fi
          }

          {
            echo "run_plugins=$(decide_coverage_scope '${{ steps.filter.outputs.plugins }}' '${{ steps.filter.outputs.plugins_files }}')"
            echo "run_rust=$(decide_coverage_scope '${{ steps.filter.outputs.rust }}' '${{ steps.filter.outputs.rust_files }}')"
            echo "run_frontend=$(decide_coverage_scope '${{ steps.filter.outputs.frontend }}' '${{ steps.filter.outputs.frontend_files }}')"
          } >> "${GITHUB_OUTPUT}"

  rust-lib-coverage-archive:
    name: Rust Lib Coverage Archive
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      # Coverage-instrumented lib builds exceed the hosted runner memory limit
      # at full Cargo concurrency; 2 jobs fit while halving the serialized
      # archive build on the critical path. Revert to 1 if the build OOMs.
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          # Cleanup costs ~77s; today's 145G runners start with ~88G free, so
          # only pay it when headroom is actually low (re-arms if images shrink).
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if (( avail_gb < 40 )); then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
            sudo docker system prune -af || true
          fi
          df -h /

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0
          components: llvm-tools-preview

      - name: Install Rust coverage tools
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: cargo-llvm-cov,nextest

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-coverage-deps

      - name: Build Rust lib coverage archive
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          cargo llvm-cov nextest-archive \
            --workspace \
            --lib \
            --features test-utils \
            --remap-path-prefix \
            --archive-file ../rust-lib-coverage.tar.zst

      - name: Upload Rust lib coverage archive
        uses: actions/upload-artifact@v7
        with:
          name: rust-lib-coverage-nextest-archive
          path: rust-lib-coverage.tar.zst
          if-no-files-found: error
          retention-days: 1

  rust-lib-coverage:
    name: Rust Lib Coverage (Shard ${{ matrix.partition }})
    needs: [changes, rust-lib-coverage-archive]
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - partition: "1/4"
            artifact_suffix: "1"
          - partition: "2/4"
            artifact_suffix: "2"
          - partition: "3/4"
            artifact_suffix: "3"
          - partition: "4/4"
            artifact_suffix: "4"
    env:
      CARGO_TERM_COLOR: never
      RALPHX_TEST_MODE: "1"
      RUST_LIB_COVERAGE_ARTIFACT: coverage-rust-lib-${{ matrix.artifact_suffix }}
      RUST_LIB_COVERAGE_ROOT: coverage/coverage-rust-lib-${{ matrix.artifact_suffix }}
    steps:
      - uses: actions/checkout@v6

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0
          components: llvm-tools-preview

      - name: Install Rust coverage tools
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: cargo-llvm-cov,nextest

      - name: Download Rust lib coverage archive
        uses: actions/download-artifact@v8
        with:
          name: rust-lib-coverage-nextest-archive
          path: .

      - name: Run Rust lib coverage
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p "../${RUST_LIB_COVERAGE_ROOT}"
          cargo llvm-cov nextest \
            --archive-file ../rust-lib-coverage.tar.zst \
            --workspace-remap "${GITHUB_WORKSPACE}/src-tauri" \
            --profile ci-coverage \
            --partition hash:${{ matrix.partition }} \
            --remap-path-prefix \
            | tee "../${RUST_LIB_COVERAGE_ROOT}/summary.txt"
          # Archive-based runs never populate target/llvm-cov-target/debug, so
          # report must read object files from the nextest archive itself.
          cargo llvm-cov report --nextest-archive-file ../rust-lib-coverage.tar.zst --lcov --output-path "../${RUST_LIB_COVERAGE_ROOT}/lcov.info"
          cargo llvm-cov report --nextest-archive-file ../rust-lib-coverage.tar.zst --json --output-path "../${RUST_LIB_COVERAGE_ROOT}/coverage.json"

      - name: Filter Rust coverage noise
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          ROOT = Path("src-tauri")
          LCOV = Path(os.environ["RUST_LIB_COVERAGE_ROOT"]) / "lcov.info"
          MACROS = (
              "tracing::trace!(",
              "tracing::debug!(",
              "tracing::info!(",
              "tracing::warn!(",
              "tracing::error!(",
              "trace!(",
              "debug!(",
              "info!(",
              "warn!(",
              "error!(",
          )
          ADAPTERS = (
              ".map_err(|",
              "tauri::async_runtime::spawn(async move {",
          )
          BLOCK_START_MARKERS_BY_SOURCE = {
              "src/application/task_transition_service.rs": (
                  "let throttled_emitter = app_handle.as_ref().and_then(|handle| {",
                  "if let Some(throttled) = throttled_emitter {",
                  "if let Some(transition_service) = self.self_arc.lock().unwrap().as_ref() {",
                  "self.emit_task_event(serde_json::json!({",
              ),
              "src/application/notification_service.rs": (
                  "pub struct TauriDesktopNotifier {",
                  "impl TauriDesktopNotifier {",
                  "impl DesktopNotifier for TauriDesktopNotifier {",
              ),
              # These command adapters require the production AppHandle runtime. Their
              # state/service entry points are covered by the root-lib behavioral suite.
              "src/commands/agent_plan_commands.rs": (
                  "pub async fn activate_agent_task_pipeline(",
                  "pub async fn start_agent_task_pipeline(",
              ),
              "src/commands/ideation_commands/ideation_commands_apply.rs": (
                  "pub async fn apply_proposals_to_kanban(",
                  "pub async fn apply_proposals_to_kanban_for_state(",
                  "pub(crate) async fn apply_supervised_proposals_to_kanban_for_state(",
                  "async fn apply_proposals_to_kanban_for_state_inner(",
              ),
              "src/commands/ideation_commands/ideation_commands_restart.rs": (
                  "#[tauri::command]",
              ),
          }
          EXCLUDED_RECORDS = {
              "src/application/app_state.rs",
              "src/shell/app_setup.rs",
              "src/application/chat_resumption.rs",
              "src/application/chat_service/chat_service_merge.rs",
              "src/application/chat_service/chat_service_queue.rs",
              "src/application/chat_service/chat_service_composer_references.rs",
              "src/application/chat_service/freshness_routing.rs",
              "src/application/ready_task_scheduler.rs",
              "src/application/reconciliation.rs",
              "src/application/reconciliation/handlers/merge.rs",
              "src/application/runtime_factory.rs",
              "src/shell/runtime_wiring.rs",
              "src/application/services/pr_merge_poller.rs",
              "src/application/chat_service/mod.rs",
              "src/application/plan_complexity_assessment.rs",
              "src/application/startup_jobs.rs",
              "src/commands/git_commands.rs",
              "src/commands/project_commands.rs",
              "src/commands/agent_composer_commands/plan_references.rs",
              "src/commands/harness_provider_commands.rs",
              "src/commands/ideation_commands/ideation_commands_session.rs",
              "src/commands/provider_cli_management_commands.rs",
              "src/commands/question_commands.rs",
              "src/commands/unified_chat_commands.rs",
              "src/http_server/mod.rs",
              "src/http_server/handlers/artifacts/approval.rs",
              "src/http_server/handlers/artifacts/create.rs",
              "src/http_server/handlers/artifacts/edit.rs",
              "src/http_server/handlers/artifacts/query.rs",
              "src/http_server/handlers/artifacts/shared.rs",
              "src/http_server/handlers/artifacts/update.rs",
              "src/http_server/handlers/ideation/proposals.rs",
              "src/http_server/handlers/plan_complexity.rs",
              "src/http_server/handlers/questions.rs",
              "src/http_server/types.rs",
              "src/domain/state_machine/transition_handler/merge_orchestrator.rs",
              "src/domain/state_machine/transition_handler/merge_outcome_handler.rs",
              "src/domain/state_machine/transition_handler/on_enter_states/merge.rs",
              "src/infrastructure/agents/claude/mod.rs",
              "src/infrastructure/agents/codex/codex_cli_client.rs",
              "src/application/agents/spawner.rs",
          }

          # Keep patch coverage focused on behavior instead of repeated
          # AppError formatting and async-spawn adapter blocks around
          # already-tested calls.
          def mark_balanced_adapter(
              lines: list[str],
              start: int,
              marker: str,
              ignored: set[int],
          ) -> int:
              depth = 0
              seen_open = False
              cursor = start
              first_column = lines[start].find(marker)
              while cursor < len(lines):
                  segment = lines[cursor][first_column:] if cursor == start else lines[cursor]
                  for char in segment:
                      if char in "([{":
                          depth += 1
                          seen_open = True
                      elif char in ")]}" and seen_open:
                          depth -= 1
                  ignored.add(cursor + 1)
                  if seen_open and depth <= 0:
                      break
                  cursor += 1
              return max(cursor + 1, start + 1)

          def mark_balanced_block(lines: list[str], start: int, ignored: set[int]) -> int:
              if start > 0 and lines[start - 1].strip() == "#[tauri::command]":
                  ignored.add(start)
              depth = 0
              seen_open = False
              cursor = start
              while cursor < len(lines):
                  for char in lines[cursor]:
                      if char == "{":
                          depth += 1
                          seen_open = True
                      elif char == "}" and seen_open:
                          depth -= 1
                  ignored.add(cursor + 1)
                  if seen_open and depth <= 0:
                      break
                  cursor += 1
              return max(cursor + 1, start + 1)

          def ignored_lines(source_key: str, source: Path) -> set[int]:
              try:
                  lines = source.read_text(encoding="utf-8").splitlines()
              except OSError:
                  return set()
              ignored: set[int] = set()
              index = 0
              while index < len(lines):
                  if lines[index].strip() in BLOCK_START_MARKERS_BY_SOURCE.get(source_key, ()):
                      index = mark_balanced_block(lines, index, ignored)
                      continue
                  marker = next((adapter for adapter in ADAPTERS if adapter in lines[index]), None)
                  if marker is not None:
                      index = mark_balanced_adapter(lines, index, marker, ignored)
                      continue
                  if not any(macro in lines[index] for macro in MACROS):
                      index += 1
                      continue
                  depth = 0
                  seen_open = False
                  cursor = index
                  while cursor < len(lines):
                      for char in lines[cursor]:
                          if char == "(":
                              depth += 1
                              seen_open = True
                          elif char == ")" and seen_open:
                              depth -= 1
                      ignored.add(cursor + 1)
                      if seen_open and depth <= 0 and ";" in lines[cursor]:
                          break
                      cursor += 1
                  index = max(cursor + 1, index + 1)
              return ignored

          cache: dict[str, set[int]] = {}
          filtered_records: list[str] = []
          for raw_record in LCOV.read_text(encoding="utf-8").split("end_of_record"):
              record_lines = [line for line in raw_record.splitlines() if line]
              if not record_lines:
                  continue
              source_key = next((line[3:] for line in record_lines if line.startswith("SF:")), None)
              if source_key in EXCLUDED_RECORDS:
                  continue
              ignored = cache.setdefault(
                  source_key or "",
                  ignored_lines(source_key, ROOT / source_key) if source_key else set(),
              )
              output: list[str] = []
              lines_found = 0
              lines_hit = 0
              for line in record_lines:
                  if line.startswith(("LF:", "LH:")):
                      continue
                  if line.startswith("DA:"):
                      line_number_raw, count_raw = line[3:].split(",", 1)
                      line_number = int(line_number_raw)
                      if line_number in ignored:
                          continue
                      lines_found += 1
                      if int(count_raw.split(",", 1)[0]) > 0:
                          lines_hit += 1
                  output.append(line)
              output.append(f"LF:{lines_found}")
              output.append(f"LH:{lines_hit}")
              filtered_records.append("\n".join(output) + "\nend_of_record")
          LCOV.write_text("\n".join(filtered_records) + "\n", encoding="utf-8")
          PY

      - name: Summarize Rust lib coverage
        run: |
          node scripts/summarize-coverage.mjs \
            --format llvm \
            --suite "Rust Lib Coverage Shard ${{ matrix.partition }}" \
            --input "${RUST_LIB_COVERAGE_ROOT}/coverage.json" \
            --output "${RUST_LIB_COVERAGE_ROOT}/coverage-summary.md"

      - name: Upload Rust lib coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.RUST_LIB_COVERAGE_ARTIFACT }}
          path: ${{ env.RUST_LIB_COVERAGE_ROOT }}/
          if-no-files-found: error
          retention-days: 14

  rust-ipc-coverage:
    name: Rust IPC Coverage
    needs: changes
    if: needs.changes.outputs.run_rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TERM_COLOR: never
      CARGO_BUILD_JOBS: "1"
      RALPHX_TEST_MODE: "1"
    steps:
      - uses: actions/checkout@v6

      - name: Free runner disk space
        shell: bash
        run: |
          set -euo pipefail
          # Cleanup costs ~77s; today's 145G runners start with ~88G free, so
          # only pay it when headroom is actually low (re-arms if images shrink).
          avail_gb=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          if (( avail_gb < 40 )); then
            sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/dotnet
            sudo docker system prune -af || true
          fi
          df -h /

      - name: Install Linux system dependencies
        uses: ./.github/actions/linux-deps

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.91.0
          components: llvm-tools-preview

      - name: Install Rust coverage tools
        uses: taiki-e/install-action@e537394e10461340f56469a03c3e73f1705074a9
        with:
          tool: cargo-llvm-cov,nextest

      - name: Rust cache
        uses: swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          workspaces: './src-tauri -> target'
          shared-key: rust-coverage-ipc

      - name: Run Rust IPC contract coverage
        shell: bash
        working-directory: src-tauri
        run: |
          set -euo pipefail
          mkdir -p ../coverage/rust-ipc
          IPC_FILTER="$(
            printf '%s' \
              'test(ipc_contract) or ' \
              'test(agent_completion_event_runtime) or ' \
              'test(release_notes_commands) or ' \
              'test(agent_workspace_repair_auto_publish) or ' \
              'test(agent_workspace_pr_review_notifications) or ' \
              'test(agent_conversation_start_team_exit) or ' \
              'test(metrics_commands) or ' \
              'test(metrics_delivery_trends) or ' \
              'test(metrics_integration) or ' \
              'test(metrics_pr_insights) or ' \
              'test(test_restart_ideation_implementation_core) or ' \
              'test(persona)'
          )"
          # Keep the selected contract suites in one invocation. Separate llvm-cov
          # nextest calls relink the instrumented root crate for every filter group.
          cargo llvm-cov nextest \
            --profile ci \
            --features test-utils \
            --test suite_ipc_commands \
            --test suite_commands \
            --test suite_agent_workspace \
            --test suite_metrics \
            --test suite_ideation \
            --test suite_chat_service \
            --test suite_http_handlers \
            --test suite_interactive_process \
            -E "${IPC_FILTER}" \
            --remap-path-prefix \
            | tee ../coverage/rust-ipc/summary.txt
          cargo llvm-cov report --lcov --output-path ../coverage/rust-ipc/lcov.info
          cargo llvm-cov report --json --output-path ../coverage/rust-ipc/coverage.json
          cargo llvm-cov report --html --output-dir ../coverage/rust-ipc/html

      - name: Filter Rust coverage noise
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          ROOT = Path("src-tauri")
          LCOV = Path("coverage/rust-ipc/lcov.info")
          MACROS = (
              "tracing::trace!(",
              "tracing::debug!(",
              "tracing::info!(",
              "tracing::warn!(",
              "tracing::error!(",
              "trace!(",
              "debug!(",
              "info!(",
              "warn!(",
              "error!(",
          )
          ADAPTERS = (
              ".map_err(|",
              "tauri::async_runtime::spawn(async move {",
          )
          BLOCK_START_MARKERS_BY_SOURCE = {
              "src/application/task_transition_service.rs": (
                  "let throttled_emitter = app_handle.as_ref().and_then(|handle| {",
                  "if let Some(throttled) = throttled_emitter {",
                  "if let Some(transition_service) = self.self_arc.lock().unwrap().as_ref() {",
                  "self.emit_task_event(serde_json::json!({",
              ),
              "src/application/notification_service.rs": (
                  "pub struct TauriDesktopNotifier {",
                  "impl TauriDesktopNotifier {",
                  "impl DesktopNotifier for TauriDesktopNotifier {",
              ),
              # Keep this aligned with the Rust lib filter above. The IPC suite
              # also instruments these production-AppHandle adapter blocks.
              "src/commands/agent_plan_commands.rs": (
                  "pub async fn activate_agent_task_pipeline(",
                  "pub async fn start_agent_task_pipeline(",
              ),
              "src/commands/ideation_commands/ideation_commands_apply.rs": (
                  "pub async fn apply_proposals_to_kanban(",
                  "pub async fn apply_proposals_to_kanban_for_state(",
                  "pub(crate) async fn apply_supervised_proposals_to_kanban_for_state(",
                  "async fn apply_proposals_to_kanban_for_state_inner(",
              ),
              "src/commands/ideation_commands/ideation_commands_restart.rs": (
                  "#[tauri::command]",
              ),
          }
          EXCLUDED_RECORDS = {
              "src/application/app_state.rs",
              "src/application/chat_resumption.rs",
              "src/application/chat_service/chat_service_queue.rs",
              "src/application/chat_service/chat_service_composer_references.rs",
              "src/application/chat_service/mod.rs",
              "src/application/plan_complexity_assessment.rs",
              "src/application/ready_task_scheduler.rs",
              "src/application/reconciliation.rs",
              "src/application/runtime_factory.rs",
              "src/shell/runtime_wiring.rs",
              "src/application/services/pr_merge_poller.rs",
              "src/application/startup_jobs.rs",
              "src/commands/agent_composer_commands/plan_references.rs",
              "src/commands/project_commands.rs",
              "src/commands/harness_provider_commands.rs",
              "src/commands/ideation_commands/ideation_commands_session.rs",
              "src/commands/provider_cli_management_commands.rs",
              "src/commands/question_commands.rs",
              "src/commands/unified_chat_commands.rs",
              "src/http_server/mod.rs",
              "src/http_server/handlers/artifacts/approval.rs",
              "src/http_server/handlers/artifacts/create.rs",
              "src/http_server/handlers/artifacts/edit.rs",
              "src/http_server/handlers/artifacts/query.rs",
              "src/http_server/handlers/artifacts/shared.rs",
              "src/http_server/handlers/artifacts/update.rs",
              "src/http_server/handlers/ideation/proposals.rs",
              "src/http_server/handlers/plan_complexity.rs",
              "src/http_server/handlers/questions.rs",
              "src/http_server/types.rs",
              "src/infrastructure/agents/claude/mod.rs",
              "src/infrastructure/agents/codex/codex_cli_client.rs",
              "src/application/agents/spawner.rs",
          }

          # Keep patch coverage focused on behavior instead of repeated
          # AppError formatting and async-spawn adapter blocks around
          # already-tested calls.
          def mark_balanced_adapter(
              lines: list[str],
              start: int,
              marker: str,
              ignored: set[int],
          ) -> int:
              depth = 0
              seen_open = False
              cursor = start
              first_column = lines[start].find(marker)
              while cursor < len(lines):
                  segment = lines[cursor][first_column:] if cursor == start else lines[cursor]
                  for char in segment:
                      if char in "([{":
                          depth += 1
                          seen_open = True
                      elif char in ")]}" and seen_open:
                          depth -= 1
                  ignored.add(cursor + 1)
                  if seen_open and depth <= 0:
                      break
                  cursor += 1
              return max(cursor + 1, start + 1)

          def mark_balanced_block(lines: list[str], start: int, ignored: set[int]) -> int:
              if start > 0 and lines[start - 1].strip() == "#[tauri::command]":
                  ignored.add(start)
              depth = 0
              seen_open = False
              cursor = start
              while cursor < len(lines):
                  for char in lines[cursor]:
                      if char == "{":
                          depth += 1
                          seen_open = True
                      elif char == "}" and seen_open:
                          depth -= 1
                  ignored.add(cursor + 1)
                  if seen_open and depth <= 0:
                      break
                  cursor += 1
              return max(cursor + 1, start + 1)

          def ignored_lines(source_key: str, source: Path) -> set[int]:
              try:
                  lines = source.read_text(encoding="utf-8").splitlines()
              except OSError:
                  return set()
              ignored: set[int] = set()
              index = 0
              while index < len(lines):
                  if lines[index].strip() in BLOCK_START_MARKERS_BY_SOURCE.get(source_key, ()):
                      index = mark_balanced_block(lines, index, ignored)
                      continue
                  marker = next((adapter for adapter in ADAPTERS if adapter in lines[index]), None)
                  if marker is not None:
                      index = mark_balanced_adapter(lines, index, marker, ignored)
                      continue
                  if not any(macro in lines[index] for macro in MACROS):
                      index += 1
                      continue
                  depth = 0
                  seen_open = False
                  cursor = index
                  while cursor < len(lines):
                      for char in lines[cursor]:
                          if char == "(":
                              depth += 1
                              seen_open = True
                          elif char == ")" and seen_open:
                              depth -= 1
                      ignored.add(cursor + 1)
                      if seen_open and depth <= 0 and ";" in lines[cursor]:
                          break
                      cursor += 1
                  index = max(cursor + 1, index + 1)
              return ignored

          cache: dict[str, set[int]] = {}
          filtered_records: list[str] = []
          for raw_record in LCOV.read_text(encoding="utf-8").split("end_of_record"):
              record_lines = [line for line in raw_record.splitlines() if line]
              if not record_lines:
                  continue
              source_key = next((line[3:] for line in record_lines if line.startswith("SF:")), None)
              if source_key in EXCLUDED_RECORDS:
                  continue
              ignored = cache.setdefault(
                  source_key or "",
                  ignored_lines(source_key, ROOT / source_key) if source_key else set(),
              )
              output: list[str] = []
              lines_found = 0
              lines_hit = 0
              for line in record_lines:
                  if line.startswith(("LF:", "LH:")):
                      continue
                  if line.startswith("DA:"):
                      line_number_raw, count_raw = line[3:].split(",", 1)
                      line_number = int(line_number_raw)
                      if line_number in ignored:
                          continue
                      lines_found += 1
                      if int(count_raw.split(",", 1)[0]) > 0:
                          lines_hit += 1
                  output.append(line)
              output.append(f"LF:{lines_found}")
              output.append(f"LH:{lines_hit}")
              filtered_records.append("\n".join(output) + "\nend_of_record")
          LCOV.write_text("\n".join(filtered_records) + "\n", encoding="utf-8")
          PY

      - name: Summarize Rust IPC coverage
        run: |
          node scripts/summarize-coverage.mjs \
            --format llvm \
            --suite "Rust IPC Coverage" \
            --input coverage/rust-ipc/coverage.json \
            --output coverage/rust-ipc/coverage-summary.md

      - name: Upload Rust IPC coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-rust-ipc
          path: coverage/rust-ipc/
          if-no-files-found: error
          retention-days: 14

  frontend-coverage:
    name: Frontend Coverage
    needs: changes
    if: needs.changes.outputs.run_frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Run frontend coverage
        run: npm run test:coverage
        working-directory: frontend

      - name: Filter frontend coverage composition surfaces
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          LCOV = Path("frontend/coverage/lcov.info")
          EXCLUDED_RECORDS = {
              "src/api/artifact.ts",
              "src/components/agents/AgentsActiveConversationPanel.tsx",
              "src/components/agents/useAgentsViewController.ts",
          }

          filtered_records: list[str] = []
          for raw_record in LCOV.read_text(encoding="utf-8").split("end_of_record"):
              record_lines = [line for line in raw_record.splitlines() if line]
              if not record_lines:
                  continue
              source_key = next((line[3:] for line in record_lines if line.startswith("SF:")), None)
              if source_key in EXCLUDED_RECORDS:
                  continue
              filtered_records.append("\n".join(record_lines) + "\nend_of_record")
          LCOV.write_text("\n".join(filtered_records) + "\n", encoding="utf-8")
          PY

      - name: Summarize frontend coverage
        run: |
          node scripts/summarize-coverage.mjs \
            --format istanbul \
            --suite "Frontend Coverage" \
            --input frontend/coverage/coverage-summary.json \
            --output frontend/coverage/coverage-summary.md

      - name: Upload frontend coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: coverage-frontend
          path: frontend/coverage/
          if-no-files-found: error
          retention-days: 14

  plugin-coverage:
    name: Plugin Coverage (${{ matrix.package_name }})
    needs: changes
    if: needs.changes.outputs.run_plugins == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - package_name: External MCP
            package_dir: plugins/app/ralphx-external-mcp
            package_lock: plugins/app/ralphx-external-mcp/package-lock.json
            artifact_name: coverage-plugin-external-mcp
            codecov_flag: plugin-external-mcp
          - package_name: Internal MCP
            package_dir: plugins/app/ralphx-mcp-server
            package_lock: plugins/app/ralphx-mcp-server/package-lock.json
            artifact_name: coverage-plugin-internal-mcp
            codecov_flag: plugin-internal-mcp
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: ${{ matrix.package_lock }}

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ matrix.package_dir }}

      - name: Run plugin coverage
        run: npm run test:coverage
        working-directory: ${{ matrix.package_dir }}

      - name: Filter plugin coverage composition surfaces
        shell: bash
        env:
          PACKAGE_DIR: ${{ matrix.package_dir }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path

          package_dir = os.environ["PACKAGE_DIR"]
          lcov = Path(package_dir) / "coverage/lcov.info"
          excluded_records = (
              {"src/index.ts"}
              if package_dir.endswith("ralphx-mcp-server")
              else set()
          )

          if not excluded_records:
              raise SystemExit(0)

          filtered_records: list[str] = []
          for raw_record in lcov.read_text(encoding="utf-8").split("end_of_record"):
              record_lines = [line for line in raw_record.splitlines() if line]
              if not record_lines:
                  continue
              source_key = next((line[3:] for line in record_lines if line.startswith("SF:")), None)
              if source_key in excluded_records:
                  continue
              filtered_records.append("\n".join(record_lines) + "\nend_of_record")
          lcov.write_text("\n".join(filtered_records) + "\n", encoding="utf-8")
          PY

      - name: Summarize plugin coverage
        run: |
          node scripts/summarize-coverage.mjs \
            --format istanbul \
            --suite "${{ matrix.package_name }} Coverage" \
            --input "${{ matrix.package_dir }}/coverage/coverage-summary.json" \
            --output "${{ matrix.package_dir }}/coverage/coverage-summary.md"

      - name: Upload plugin coverage artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.package_dir }}/coverage/
          if-no-files-found: error
          retention-days: 14

  publish-codecov:
    name: Publish Codecov Coverage
    needs:
      - changes
      - rust-lib-coverage
      - rust-ipc-coverage
      - frontend-coverage
      - plugin-coverage
    if: >
      always() &&
      github.event_name != 'merge_group' &&
      needs.changes.result == 'success' &&
      (
        needs.changes.outputs.run_rust == 'true' ||
        needs.changes.outputs.run_frontend == 'true' ||
        needs.changes.outputs.run_plugins == 'true'
      ) &&
      (
        needs.changes.outputs.run_rust != 'true' ||
        (
          needs.rust-lib-coverage.result == 'success' &&
          needs.rust-ipc-coverage.result == 'success'
        )
      ) &&
      (
        needs.changes.outputs.run_frontend != 'true' ||
        needs.frontend-coverage.result == 'success'
      ) &&
      (
        needs.changes.outputs.run_plugins != 'true' ||
        needs.plugin-coverage.result == 'success'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - uses: actions/checkout@v6

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          path: coverage-artifacts
        continue-on-error: true

      - name: Validate coverage artifacts (with retry)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_RUST: ${{ needs.changes.outputs.run_rust }}
          RUN_FRONTEND: ${{ needs.changes.outputs.run_frontend }}
          RUN_PLUGINS: ${{ needs.changes.outputs.run_plugins }}
        run: |
          set -euo pipefail

          validate_artifacts() {
            if [[ "${RUN_RUST}" == "true" ]]; then
              [[ -s coverage-artifacts/coverage-rust-lib-1/lcov.info ]] || return 1
              [[ -s coverage-artifacts/coverage-rust-lib-2/lcov.info ]] || return 1
              [[ -s coverage-artifacts/coverage-rust-lib-3/lcov.info ]] || return 1
              [[ -s coverage-artifacts/coverage-rust-lib-4/lcov.info ]] || return 1
              [[ -s coverage-artifacts/coverage-rust-ipc/lcov.info ]] || return 1
            fi
            if [[ "${RUN_FRONTEND}" == "true" ]]; then
              [[ -s coverage-artifacts/coverage-frontend/lcov.info ]] || return 1
            fi
            if [[ "${RUN_PLUGINS}" == "true" ]]; then
              [[ -s coverage-artifacts/coverage-plugin-internal-mcp/lcov.info ]] || return 1
              [[ -s coverage-artifacts/coverage-plugin-external-mcp/lcov.info ]] || return 1
            fi
            return 0
          }

          MAX_RETRIES=3
          RETRY_DELAY=15

          for attempt in $(seq 1 "${MAX_RETRIES}"); do
            if [[ ${attempt} -gt 1 ]]; then
              echo "::warning::Attempt ${attempt}/${MAX_RETRIES}: re-downloading coverage artifacts after ${RETRY_DELAY}s..."
              sleep "${RETRY_DELAY}"
              rm -rf coverage-artifacts
              gh run download "${{ github.run_id }}" -D coverage-artifacts 2>&1 || true
            fi

            if validate_artifacts; then
              echo "Coverage artifacts validated successfully (attempt ${attempt}/${MAX_RETRIES})"
              exit 0
            fi

            echo "Attempt ${attempt}/${MAX_RETRIES}: some coverage artifacts are missing or empty"
            ls -laR coverage-artifacts/ 2>/dev/null || echo "coverage-artifacts/ directory not found"
          done

          echo "::error::Required coverage artifacts still missing after ${MAX_RETRIES} attempts"
          exit 1

      - name: Report unavailable Codecov upload
        if: env.CODECOV_TOKEN == ''
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${IS_FORK_PR}" == "true" ]]; then
            echo "::notice::Codecov upload skipped because fork pull_request runs do not receive repository secrets."
          else
            echo "::warning::Codecov upload skipped because CODECOV_TOKEN is unavailable."
          fi

      - name: Upload Rust lib coverage to Codecov
        if: needs.rust-lib-coverage.result == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          disable_search: true
          files: coverage-artifacts/coverage-rust-lib-1/lcov.info,coverage-artifacts/coverage-rust-lib-2/lcov.info,coverage-artifacts/coverage-rust-lib-3/lcov.info,coverage-artifacts/coverage-rust-lib-4/lcov.info,coverage-artifacts/coverage-rust-ipc/lcov.info
          flags: rust-lib
          name: rust-lib
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.number }}
          fail_ci_if_error: true

      - name: Upload Rust IPC coverage to Codecov
        if: needs.rust-ipc-coverage.result == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          disable_search: true
          files: coverage-artifacts/coverage-rust-lib-1/lcov.info,coverage-artifacts/coverage-rust-lib-2/lcov.info,coverage-artifacts/coverage-rust-lib-3/lcov.info,coverage-artifacts/coverage-rust-lib-4/lcov.info,coverage-artifacts/coverage-rust-ipc/lcov.info
          flags: rust-ipc
          name: rust-ipc
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.number }}
          fail_ci_if_error: true

      - name: Upload frontend coverage to Codecov
        if: needs.frontend-coverage.result == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          disable_search: true
          files: coverage-artifacts/coverage-frontend/lcov.info
          flags: frontend
          name: frontend
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.number }}
          fail_ci_if_error: true

      - name: Upload internal MCP coverage to Codecov
        if: needs.plugin-coverage.result == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          disable_search: true
          files: coverage-artifacts/coverage-plugin-internal-mcp/lcov.info
          flags: plugin-internal-mcp
          name: plugin-internal-mcp
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.number }}
          fail_ci_if_error: true

      - name: Upload external MCP coverage to Codecov
        if: needs.plugin-coverage.result == 'success' && env.CODECOV_TOKEN != ''
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          use_pypi: true
          disable_search: true
          files: coverage-artifacts/coverage-plugin-external-mcp/lcov.info
          flags: plugin-external-mcp
          name: plugin-external-mcp
          override_commit: ${{ github.event.pull_request.head.sha || github.sha }}
          override_branch: ${{ github.head_ref || github.ref_name }}
          override_pr: ${{ github.event.number }}
          fail_ci_if_error: true

  coverage-gate:
    name: Coverage Gate
    needs:
      - changes
      - rust-lib-coverage
      - rust-ipc-coverage
      - frontend-coverage
      - plugin-coverage
      - publish-codecov
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      GH_TOKEN: ${{ github.token }}
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      IS_FORK_PR: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository }}
    steps:
      - name: Enforce Codecov patch status
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ needs.changes.result }}" != "success" ]]; then
            echo "Coverage scope detection did not complete successfully."
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" != "pull_request" && "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            echo "Coverage gate only enforces patch coverage on pull requests."
            exit 0
          fi

          coverage_required=false
          if [[ "${{ needs.changes.outputs.run_rust }}" == "true" || "${{ needs.changes.outputs.run_frontend }}" == "true" || "${{ needs.changes.outputs.run_plugins }}" == "true" ]]; then
            coverage_required=true
          fi

          if [[ "${coverage_required}" != "true" ]]; then
            echo "No coverage-relevant files changed; skipping Codecov patch gate."
            exit 0
          fi

          failures=()
          if [[ "${{ needs.changes.outputs.run_rust }}" == "true" ]]; then
            [[ "${{ needs.rust-lib-coverage.result }}" == "success" ]] || failures+=("Rust Lib Coverage: ${{ needs.rust-lib-coverage.result }}")
            [[ "${{ needs.rust-ipc-coverage.result }}" == "success" ]] || failures+=("Rust IPC Coverage: ${{ needs.rust-ipc-coverage.result }}")
          fi
          if [[ "${{ needs.changes.outputs.run_frontend }}" == "true" ]]; then
            [[ "${{ needs.frontend-coverage.result }}" == "success" ]] || failures+=("Frontend Coverage: ${{ needs.frontend-coverage.result }}")
          fi
          if [[ "${{ needs.changes.outputs.run_plugins }}" == "true" ]]; then
            [[ "${{ needs.plugin-coverage.result }}" == "success" ]] || failures+=("Plugin Coverage: ${{ needs.plugin-coverage.result }}")
          fi
          if [[ "${GITHUB_EVENT_NAME}" != "merge_group" ]]; then
            [[ "${{ needs.publish-codecov.result }}" == "success" ]] || failures+=("Publish Codecov Coverage: ${{ needs.publish-codecov.result }}")
          fi

          if (( ${#failures[@]} > 0 )); then
            printf 'Coverage prerequisite failed: %s\n' "${failures[@]}"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "merge_group" ]]; then
            echo "Queue run enforces coverage job success; codecov/patch is PR-scoped and publish-codecov is intentionally skipped."
            exit 0
          fi

          if [[ "${IS_FORK_PR}" == "true" ]]; then
            echo "Pull request comes from a fork."
            echo "GitHub does not pass repository secrets to pull_request workflows from forks, so Codecov upload cannot publish codecov/patch."
            echo "Coverage jobs completed successfully; skipping Codecov patch gate for this fork PR."
            exit 0
          fi

          if [[ -z "${CODECOV_TOKEN}" ]]; then
            echo "CODECOV_TOKEN is unavailable for a coverage-required PR; cannot upload coverage or receive codecov/patch."
            echo "Configure CODECOV_TOKEN or adjust the coverage policy before requiring Codecov patch coverage."
            exit 1
          fi

          echo "Waiting for Codecov patch status on ${COMMIT_SHA}."
          query_gh_jq() {
            local label="$1"
            shift
            local attempt=1
            local output

            while (( attempt <= 3 )); do
              if output="$(gh api "$@" 2>&1)"; then
                printf '%s' "${output}"
                return 0
              fi

              local message="${output//$'\n'/ }"
              echo "::warning::GitHub API query for ${label} failed on attempt ${attempt}/3: ${message:0:500}" >&2
              if (( attempt < 3 )); then
                sleep 2
              fi
              attempt=$((attempt + 1))
            done

            return 1
          }

          deadline=$((SECONDS + 600))
          while (( SECONDS < deadline )); do
            status_state="$(
              query_gh_jq "codecov/patch commit status" "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/statuses" \
                --jq 'map(select(.context == "codecov/patch"))[0].state // ""'
            )" || status_state=""
            check_state="$(
              query_gh_jq "codecov/patch check run" --method GET "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs" \
                -f check_name="codecov/patch" \
                --jq '.check_runs | sort_by(.completed_at // .started_at // .created_at) | .[-1] | if . == null then "" elif .status != "completed" then "pending" else .conclusion end'
            )" || check_state=""

            state=""
            failure_state=""
            for candidate in "${status_state}" "${check_state}"; do
              case "${candidate}" in
                success)
                  state="success"
                  break
                  ;;
                pending)
                  if [[ -z "${state}" ]]; then
                    state="pending"
                  fi
                  ;;
                failure|error|timed_out|cancelled|action_required)
                  failure_state="${candidate}"
                  ;;
              esac
            done
            if [[ -z "${state}" ]]; then
              if [[ -n "${failure_state}" ]]; then
                state="${failure_state}"
              fi
            fi

            case "${state}" in
              success)
                echo "Codecov patch status passed."
                exit 0
                ;;
              failure|error|timed_out|cancelled|action_required)
                echo "Codecov patch status is ${state}; waiting for a final success or timeout."
                ;;
              pending)
                echo "Codecov patch status is pending; waiting."
                ;;
              "")
                echo "Codecov patch status has not been posted yet; waiting."
                ;;
              *)
                echo "Unexpected Codecov patch status: ${state}"
                exit 1
                ;;
            esac

            sleep 10
          done

          echo "Timed out waiting for Codecov patch status to pass."
          final_status_error=false
          final_status="$(
            query_gh_jq "final codecov/patch commit status" "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/statuses" \
              --jq 'map(select(.context == "codecov/patch"))[0] // empty'
          )" || final_status_error=true
          final_check_error=false
          final_check="$(
            query_gh_jq "final codecov/patch check run" --method GET "repos/${GITHUB_REPOSITORY}/commits/${COMMIT_SHA}/check-runs" \
              -f check_name="codecov/patch" \
              --jq '.check_runs | sort_by(.completed_at // .started_at // .created_at) | .[-1] // empty'
          )" || final_check_error=true
          printf '%s\n' "${final_status}"
          printf '%s\n' "${final_check}"

          if [[ -z "${final_status}" && -z "${final_check}" ]]; then
            if [[ "${final_status_error}" == "true" || "${final_check_error}" == "true" ]]; then
              echo "::warning::Codecov patch status could not be confirmed because GitHub API polling returned non-JSON or transport errors after retries; treating the unavailable external status as non-blocking after successful coverage uploads."
              exit 0
            fi
            echo "::warning::Codecov did not post codecov/patch after successful coverage uploads; treating the missing external status as non-blocking."
            exit 0
          fi

          exit 1
