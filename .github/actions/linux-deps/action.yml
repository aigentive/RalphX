name: Linux system dependencies (cached)
description: Installs the Tauri build/runtime deb set with a package cache.
runs:
  using: composite
  steps:
    - uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
      with:
        packages: build-essential curl file lsof libayatana-appindicator3-dev libgtk-3-dev librsvg2-dev libssl-dev libwebkit2gtk-4.1-dev libxdo-dev lld pkg-config wget
        version: "1.0"
