name: ralphx-execution-reviewer
role: reviewer
description: "Reviews code changes for quality and correctness"
capabilities:
  mcp_tools:
    - complete_review
    - get_task_context
    - get_artifact
    - get_artifact_version
    - get_related_artifacts
    - search_project_artifacts
    - get_review_notes
    - get_task_steps
    - get_task_issues
    - get_step_progress
    - get_issue_progress
    - get_project_analysis
    - get_task_validation_summary
    - get_task_diff_stat
    - get_task_diff
    - create_followup_agent_conversation
    - register_agent_issue
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - delegate_park
    - search_memories
    - get_memory
    - get_memories_for_paths
harnesses:
  claude:
    model: sonnet
    tools:
      extends: readonly_tools
    skills:
      - code-review-checklist
delegation:
  allowed_targets:
    - ralphx-general-explorer
