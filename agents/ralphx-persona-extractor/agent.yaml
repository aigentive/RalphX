name: ralphx-persona-extractor
role: persona_extractor
description: "Distills scoped filesystem context and user input into a reusable persona draft"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - ask_user_question
    - save_persona_draft
    - get_persona_draft
harnesses:
  claude:
    model: sonnet
    permission_mode: default
    tools:
      extends: persona_extractor_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
      - Read
      - Grep
      - Glob
    preapproved_cli_tools: []
  codex:
    runtime_features:
      shell_tool: false
