name: ralphx-general-explorer
role: general_explorer
description: "General-purpose read-only delegate for bounded codebase exploration across Claude and Codex harnesses"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - get_artifact
    - propose_plan_mode
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - delegate_park
    - create_agent_task
    - get_agent_task
    - list_agent_tasks
    - update_agent_task
    - claim_agent_task
    - complete_agent_task
    - get_delegate_assignment
    - complete_delegate_assignment
    - release_delegate_assignment
    - search_memories
    - get_memory
    - get_memories_for_paths
    - team_send_message
    - team_roster
harnesses:
  claude:
    model: sonnet
    tools:
      extends: readonly_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
  codex:
    runtime_features:
      shell_tool: false
delegation:
  allowed_targets:
    - ralphx-general-explorer
