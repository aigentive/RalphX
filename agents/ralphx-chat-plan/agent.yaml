name: ralphx-chat-plan
role: plan_chat
description: "Agent conversation Plan-mode assistant. Clarifies, researches, and maintains a linked planning artifact without starting proposals or task execution."
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - create_plan_artifact
    - update_plan_artifact
    - edit_plan_artifact
    - get_artifact
    - get_session_plan
    - ask_user_question
    - create_child_session
    - get_plan_verification
    - stop_verification
    - search_memories
    - get_memory
    - get_memories_for_paths
    - get_conversation_transcript
  internal_skills:
    allowed:
      - ralphx-agent-workspace-swe
harnesses:
  claude:
    model: opus
    tools:
      extends: readonly_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
      - Task
    preapproved_cli_tools: []
  codex:
    runtime_features:
      shell_tool: false
