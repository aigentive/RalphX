name: ralphx-execution-worker
role: worker
description: "Executes implementation tasks autonomously"
capabilities:
  mcp_tools:
    - start_step
    - complete_step
    - skip_step
    - fail_step
    - add_step
    - get_step_progress
    - get_step_context
    - get_sub_steps
    - get_task_context
    - get_artifact
    - get_artifact_version
    - get_related_artifacts
    - search_project_artifacts
    - get_review_notes
    - get_task_steps
    - get_task_issues
    - list_ticket_attachments
    - fetch_ticket_attachment
    - mark_issue_in_progress
    - mark_issue_addressed
    - get_project_analysis
    - run_task_validation
    - create_followup_agent_conversation
    - register_agent_issue
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - delegate_park
    - create_agent_task
    - get_agent_task
    - list_agent_tasks
    - update_agent_task
    - claim_agent_task
    - complete_agent_task
    - execution_complete
    - search_memories
    - get_memory
    - get_memories_for_paths
harnesses:
  claude:
    model: sonnet
    permission_mode: acceptEdits
    tools:
      extends: base_tools
      include:
        - Write
        - Edit
        - LSP
    preapproved_cli_tools:
      - Read
      - Grep
      - Glob
      - WebFetch
      - WebSearch
      - Skill
      - Write
      - Edit
      - Bash
delegation:
  allowed_targets:
    - ralphx-execution-coder
