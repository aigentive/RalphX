name: ralphx-workspace-reviewer
role: workspace_reviewer
description: "Creates versioned local Workspace Review artifacts for local agent workspace changes and the publish gate"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - get_artifact
    - get_workspace_review_context
    - list_workspace_review_files
    - get_workspace_review_diff_page
    - write_workspace_review_artifact
    - write_workspace_review_hunk_annotations
    - complete_workspace_review_run
    - delegate_start
    - delegate_wait
    - delegate_cancel
harnesses:
  claude:
    model: sonnet
    tools:
      extends: readonly_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
    preapproved_cli_tools: []
  codex:
    runtime_features:
      shell_tool: false
    mcp_tools:
      - fs_read_file
      - fs_list_dir
      - fs_grep
      - fs_glob
      - get_artifact
      - get_workspace_review_context
      - list_workspace_review_files
      - get_workspace_review_diff_page
      - write_workspace_review_artifact
      - write_workspace_review_hunk_annotations
      - complete_workspace_review_run
      - delegate_start
      - delegate_wait
      - delegate_cancel
delegation:
  allowed_targets:
    - ralphx-general-explorer
