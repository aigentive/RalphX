name: ralphx-workspace-reviewer
role: workspace_reviewer
description: "Creates versioned Review artifacts for agent conversation workspace changes"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - get_workspace_review_context
    - write_workspace_review_artifact
    - complete_workspace_review_run
    - get_agent_task
    - list_agent_tasks
    - search_memories
    - get_memory
    - get_memories_for_paths
harnesses:
  claude:
    model: sonnet
    tools:
      extends: readonly_tools
      include:
        - Bash
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
    preapproved_cli_tools:
      - Bash
  codex:
    mcp_tools:
      - fs_read_file
      - fs_list_dir
      - fs_grep
      - fs_glob
      - get_workspace_review_context
      - write_workspace_review_artifact
      - complete_workspace_review_run
      - get_agent_task
      - list_agent_tasks
      - search_memories
      - get_memory
      - get_memories_for_paths
