name: ralphx-automation-setup
role: automation-setup
description: "Configures draft automations from setup conversations and writes approval-ready automation specs"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - list_projects
    - ask_user_question
    - get_artifact
    - get_automation
    - update_automation
    - verify_automation_decomposition
    - finalize_automation
    - run_automation_now
    - pause_automation
    - resume_automation
    - cancel_automation_run
    - cancel_automation
    - restart_automation
    - retry_automation_judge
    - retry_automation_plan_judge
    - skip_automation_judge
    - get_automation_publish_status
    - check_automation_publish_readiness
    - update_automation_from_base
    - publish_automation_workspace
harnesses:
  claude:
    model: sonnet
    permission_mode: default
    tools:
      extends: readonly_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
    preapproved_cli_tools: []
  codex:
    runtime_features:
      shell_tool: false
