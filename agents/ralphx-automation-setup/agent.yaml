name: ralphx-automation-setup
role: automation-setup
description: "Configures draft automations from setup conversations and writes approval-ready automation specs"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - list_projects
    - ask_user_question
    - get_artifact
    - get_automation
    - update_automation
    - finalize_automation
harnesses:
  claude:
    model: sonnet
    permission_mode: default
    tools:
      extends: readonly_tools
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
    preapproved_cli_tools: []
  codex:
    runtime_features:
      shell_tool: false
