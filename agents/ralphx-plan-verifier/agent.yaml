---
name: ralphx-plan-verifier
role: plan_verifier
description: "Compatibility metadata for ideation verification routing"
capabilities:
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - get_session_plan
    - get_artifact
    - list_session_proposals
    - get_proposal
    - get_parent_session_context
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - search_memories
    - get_memory
    - get_memories_for_paths
    - complete_plan_verification
harnesses:
  claude:
    model: opus
    tools:
      extends: base_tools
    preapproved_cli_tools: []
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Bash
  codex:
    runtime_features:
      shell_tool: false
delegation:
  allowed_targets:
    - ralphx-plan-critic-completeness
