name: ralphx-general-worker
role: general_worker
description: "General-purpose bounded implementation delegate that can inspect code, make scoped edits, and return a complete handoff summary"
capabilities:
  project_skill_buckets:
    - planning
    - execution
    - review
  project_skill_stages:
    - planning
    - execution
    - review
  mcp_tools:
    - fs_read_file
    - fs_list_dir
    - fs_grep
    - fs_glob
    - get_artifact
    - propose_plan_mode
    - get_agent_workspace_publish_status
    - check_agent_workspace_publish_readiness
    - update_agent_workspace_from_base
    - publish_agent_workspace
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - create_agent_task
    - get_agent_task
    - list_agent_tasks
    - update_agent_task
    - claim_agent_task
    - complete_agent_task
    - get_delegate_assignment
    - complete_delegate_assignment
    - release_delegate_assignment
    - search_memories
    - get_memory
    - get_memories_for_paths
    - list_project_skills
    - get_project_skill
    - create_agent_workflow_script
    - start_agent_workflow_run
    - get_agent_workflow_run
    - pause_agent_workflow_run
    - resume_agent_workflow_run
    - cancel_agent_workflow_run
  internal_skills:
    allowed:
      - ralphx-agent-workflow-orchestrator
harnesses:
  claude:
    model: sonnet
    permission_mode: acceptEdits
    tools:
      extends: readonly_tools
      include:
        - Write
        - Edit
        - Bash
        - LSP
  codex:
    runtime_features:
      shell_tool: true
delegation:
  allowed_targets:
    - ralphx-general-explorer
    - ralphx-general-worker
