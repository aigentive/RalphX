name: ralphx-ideation
role: ideation_orchestrator
description: "Facilitates ideation sessions and generates task proposals for RalphX"
capabilities:
  mcp_tools:
    - create_task_proposal
    - update_task_proposal
    - archive_task_proposal
    - delete_task_proposal
    - list_session_proposals
    - get_proposal
    - analyze_session_dependencies
    - create_plan_artifact
    - update_plan_artifact
    - edit_plan_artifact
    - get_artifact
    - link_proposals_to_plan
    - get_session_plan
    - ask_user_question
    - create_child_session
    - get_parent_session_context
    - delegate_start
    - delegate_wait
    - delegate_cancel
    - create_agent_task
    - get_agent_task
    - list_agent_tasks
    - update_agent_task
    - claim_agent_task
    - complete_agent_task
    - get_session_messages
    - get_plan_verification
    - complete_plan_verification
    - search_memories
    - get_memory
    - get_memories_for_paths
    - get_acceptance_status
    - get_pending_confirmations
    - list_projects
    - create_cross_project_session
    - cross_project_guide
    - get_child_session_status
    - send_ideation_session_message
    - finalize_proposals
    - migrate_proposals
harnesses:
  claude:
    model: opus
    effort: max
    tools:
      extends: base_tools
      include:
        - Task
    disallowed_tools:
      - Write
      - Edit
      - NotebookEdit
      - Task(ralphx:*)
    preapproved_cli_tools:
      - Task(Plan)
    skills:
      - task-decomposition
      - priority-assessment
      - dependency-analysis
profiles:
  plan:
    role: plan_chat
    description: "Agent conversation Plan-mode assistant. Clarifies, researches, and maintains a linked Overview and Implementation Blueprint bundle without starting proposals or task execution."
    capabilities:
      mcp_tools:
        - fs_read_file
        - fs_list_dir
        - fs_grep
        - fs_glob
        - create_plan_artifact
        - update_plan_artifact
        - edit_plan_artifact
        - get_artifact
        - get_session_plan
        - ask_user_question
        - get_plan_verification
        - complete_plan_verification
        - delegate_start
        - delegate_wait
        - delegate_cancel
        - search_memories
        - get_memory
        - get_memories_for_paths
        - get_conversation_transcript
      internal_skills:
        allowed:
          - ralphx-agent-workspace-swe
    harnesses:
      claude:
        model: opus
        tools:
          extends: readonly_tools
        disallowed_tools:
          - Write
          - Edit
          - NotebookEdit
          - Bash
          - Task
        preapproved_cli_tools: []
      codex:
        runtime_features:
          shell_tool: false
    delegation:
      allowed_targets:
        - ralphx-general-explorer
delegation:
  allowed_targets:
    - ralphx-ideation-specialist-backend
    - ralphx-ideation-specialist-frontend
    - ralphx-ideation-specialist-infra
    - ralphx-ideation-advocate
    - ralphx-ideation-critic
    - ralphx-general-explorer
