name: ralphx-project-analyzer
role: project_analyzer
description: "Scans project structure to detect build systems, install context, and worktree setup"
capabilities:
  mcp_tools:
    - save_project_analysis
    - get_project_analysis
harnesses:
  claude:
    model: haiku
    tools:
      extends: base_tools
    preapproved_cli_tools:
      - Read
      - Glob
      - Bash
      - Grep
