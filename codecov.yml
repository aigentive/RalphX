coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 0%
        only_pulls: true
        paths:
          # Async streaming loops (process_stream_background, process_codex_stream_background)
          # are only exercised by integration tests with real process spawning.
          # Testable logic is extracted into public helper functions with full unit coverage.
          - "!src-tauri/src/application/chat_service/chat_service_streaming.rs"
          # Startup composition roots mostly wire long-lived Tauri services, timers, and
          # background loops. Keep behavior covered through extracted helpers/services.
          - "!src-tauri/src/application/startup_pipeline.rs"
          - "!src-tauri/src/application/startup_pipeline_launch.rs"
          - "!src-tauri/src/application/startup_transition_factory.rs"
          # Tauri RunEvent / HTTP-server boot glue — same composition-root pattern.
          # The Exit-arm body needs the full production AppState AND a non-async
          # caller context (tauri::async_runtime::block_on panics inside
          # #[tokio::test]); the ExitRequested arm's `api: ExitRequestApi` field
          # has no public constructor in Tauri 2.x. The actual decision logic is
          # extracted into pub(crate) `trigger_http_shutdown` + `HttpShutdownHandle`,
          # both unit-tested in `application/shutdown_tests.rs` and
          # `application/http_shutdown_tests.rs`.
          - "!src-tauri/src/application/shutdown.rs"
          - "!src-tauri/src/application/server_boot.rs"
          # Pure trait/module export glue has no runtime branch to exercise directly.
          # Implementations and call sites carry the behavioral coverage.
          - "!src-tauri/src/domain/repositories/orphan_worktree_cleanup_marker_repository.rs"
          - "!src-tauri/src/domain/repositories/mod.rs"
          - "!src-tauri/src/infrastructure/memory/mod.rs"
          - "!src-tauri/src/infrastructure/sqlite/mod.rs"
          # GitHub auth subprocess probes depend on local gh credential state.
          # Deterministic URL parsing and auth-preflight logic are covered separately.
          - "!src-tauri/src/infrastructure/git_auth.rs"

ignore:
  # Rust integration tests, sidecar test modules, and shared test support.
  - "src-tauri/tests/**"
  - "src-tauri/src/testing/**"
  - "src-tauri/src/**/tests.rs"
  - "src-tauri/src/**/tests/**"
  - "src-tauri/src/**/*_test.rs"
  - "src-tauri/src/**/*_tests.rs"
  # Frontend test sources, snapshots, fixtures, and mocks.
  - "frontend/tests/**"
  - "frontend/src/**/__tests__/**"
  - "frontend/src/**/__snapshots__/**"
  - "frontend/src/**/*.test.*"
  - "frontend/src/**/*.spec.*"
  - "frontend/src/**/*.testSetup.*"
  - "frontend/src/mocks/**"
  # Plugin MCP test sources and generated test artifacts.
  - "plugins/app/**/tests/**"
  - "plugins/app/**/__tests__/**"
  - "plugins/app/**/*.test.*"
  - "plugins/app/**/*.spec.*"

flags:
  rust-lib:
    paths:
      - "src-tauri/crates/"
      - "src-tauri/src/application/"
      - "src-tauri/src/domain/"
      - "src-tauri/src/infrastructure/"
  rust-ipc:
    paths:
      - "src-tauri/src/commands/"
      - "src-tauri/tests/"
  frontend:
    paths:
      - "frontend/src/"
  plugin-external-mcp:
    paths:
      - "plugins/app/ralphx-external-mcp/"
  plugin-internal-mcp:
    paths:
      - "plugins/app/ralphx-mcp-server/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 2%
      - type: patch
        target: 90%
        threshold: 0%
        only_pulls: true

github_checks:
  annotations: false
