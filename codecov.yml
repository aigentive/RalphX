coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 0%
        only_pulls: true

ignore:
  # Rust integration tests, sidecar test modules, and shared test support.
  - "src-tauri/tests/**"
  - "src-tauri/src/testing/**"
  - "src-tauri/src/**/tests.rs"
  - "src-tauri/src/**/tests/**"
  - "src-tauri/src/**/*_test.rs"
  - "src-tauri/src/**/*_tests.rs"
  # Frontend test sources, snapshots, fixtures, and mocks.
  - "frontend/tests/**"
  - "frontend/src/**/__tests__/**"
  - "frontend/src/**/__snapshots__/**"
  - "frontend/src/**/*.test.*"
  - "frontend/src/**/*.spec.*"
  - "frontend/src/**/*.testSetup.*"
  - "frontend/src/mocks/**"
  # Plugin MCP test sources and generated test artifacts.
  - "plugins/app/**/tests/**"
  - "plugins/app/**/__tests__/**"
  - "plugins/app/**/*.test.*"
  - "plugins/app/**/*.spec.*"

flags:
  rust-lib:
    paths:
      - "src-tauri/crates/"
      - "src-tauri/src/application/"
      - "src-tauri/src/domain/"
      - "src-tauri/src/infrastructure/"
  rust-ipc:
    paths:
      - "src-tauri/src/commands/"
      - "src-tauri/tests/"
  frontend:
    paths:
      - "frontend/src/"
  plugin-external-mcp:
    paths:
      - "plugins/app/ralphx-external-mcp/"
  plugin-internal-mcp:
    paths:
      - "plugins/app/ralphx-mcp-server/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 2%
      - type: patch
        target: 90%
        threshold: 0%
        only_pulls: true

github_checks:
  annotations: false
