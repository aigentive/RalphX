coverage:
  precision: 2
  round: down
  range: "60...90"
  status:
    project:
      default:
        target: auto
        threshold: 2%
    patch:
      default:
        target: 90%
        threshold: 0%
        only_pulls: true
        paths:
          # Async streaming loops (process_stream_background, process_codex_stream_background)
          # are only exercised by integration tests with real process spawning.
          # Testable logic is extracted into public helper functions with full unit coverage.
          - "!src-tauri/src/application/chat_service/chat_service_streaming.rs"
          # Startup composition roots mostly wire long-lived Tauri services, timers, and
          # background loops. Keep behavior covered through extracted helpers/services.
          - "!src-tauri/src/application/app_setup.rs"
          - "!src-tauri/src/application/runtime_wiring.rs"
          - "!src-tauri/src/application/startup_background.rs"
          - "!src-tauri/src/application/startup_bootstrap.rs"
          - "!src-tauri/src/application/startup_cleanup.rs"
          - "!src-tauri/src/application/startup_pipeline.rs"
          - "!src-tauri/src/application/startup_pipeline_launch.rs"
          - "!src-tauri/src/application/startup_transition_factory.rs"
          # Startup commands wrap Tauri State/AppHandle and the opener plugin.
          # Their deterministic diagnostics/retry/path helpers are sidecar-tested.
          - "!src-tauri/src/commands/startup_commands.rs"
          # Tauri RunEvent / HTTP-server boot glue — same composition-root pattern.
          # The Exit-arm body needs the full production AppState AND a non-async
          # caller context (tauri::async_runtime::block_on panics inside
          # #[tokio::test]); the ExitRequested arm's `api: ExitRequestApi` field
          # has no public constructor in Tauri 2.x. The actual decision logic is
          # extracted into pub(crate) `trigger_http_shutdown` + `HttpShutdownHandle`,
          # both unit-tested in `application/shutdown_tests.rs` and
          # `application/http_shutdown_tests.rs`.
          - "!src-tauri/src/application/shutdown.rs"
          - "!src-tauri/src/application/server_boot.rs"
          # Per-harness child-process cleanup (Claude + Codex). Both files wrap
          # real subprocess spawning, stdio handling, and OS signal management
          # — only exercisable via integration tests with real process spawning
          # (same precedent as chat_service_streaming.rs above). Decision logic
          # is extracted into spawn_isolation::send_signal_to_group (safety
          # guards + ESRCH branch fully unit-tested in spawn_isolation_tests).
          - "!src-tauri/src/infrastructure/agents/claude/claude_code_client.rs"
          - "!src-tauri/src/infrastructure/agents/codex/codex_cli_client.rs"
          # setsid + killpg helpers. install_setsid_pre_exec's pre_exec closure
          # only runs in the forked child after spawn — verifiable end-to-end
          # only by the ignored capability test in spawn_isolation_tests. The
          # callable parent-side surfaces (safety guards, ESRCH path, hook
          # registration) ARE covered by the default-run unit tests.
          - "!src-tauri/src/infrastructure/agents/spawn_isolation.rs"
          # Pure trait/module export glue has no runtime branch to exercise directly.
          # Implementations and call sites carry the behavioral coverage.
          - "!src-tauri/crates/ralphx-domain/src/repositories/agent_conversation_workspace_repository.rs"
          - "!src-tauri/src/domain/repositories/orphan_worktree_cleanup_marker_repository.rs"
          - "!src-tauri/crates/ralphx-domain/src/repositories/plan_branch_repository.rs"
          - "!src-tauri/src/domain/repositories/mod.rs"
          - "!src-tauri/src/infrastructure/memory/mod.rs"
          - "!src-tauri/src/infrastructure/sqlite/mod.rs"
          # Native Atlassian support spans live external APIs, OAuth loopback
          # listener plumbing, replayable secret storage, Tauri command glue,
          # SQLite persistence glue, startup/settings composition, queued
          # replay orchestration, and a settings/auth UI. Keep Codecov's patch
          # gate focused on deterministic behavior instead of requiring
          # statement coverage for these desktop/integration adapter surfaces.
          - "!frontend/src/api/atlassian.ts"
          - "!frontend/src/components/settings/AtlassianIntegrationSettingsPanel.tsx"
          - "!frontend/src/hooks/useAtlassianIntegration.ts"
          - "!frontend/src/App.tsx"
          - "!frontend/src/components/settings/SettingsDialog.performance.ts"
          - "!frontend/src/components/settings/SettingsSectionContent.tsx"
          - "!src-tauri/src/application/app_state.rs"
          - "!src-tauri/src/application/chat_service/chat_service_queue.rs"
          - "!src-tauri/src/application/atlassian_integration_service.rs"
          - "!src-tauri/src/commands/atlassian_commands.rs"
          # Plan-mode transition and artifact-reference support spans Tauri
          # command glue, HTTP DTO/handler adapters, long-lived agent spawn
          # orchestration, and large agent UI container/controller surfaces.
          # Deterministic behavior is covered through extracted helper tests,
          # IPC/component suites, and visual coverage; keep the patch gate off
          # the composition layers that mostly wire those tested pieces.
          - "!frontend/src/api/artifact.ts"
          - "!frontend/src/components/agents/AgentsActiveConversationPanel.tsx"
          - "!frontend/src/components/agents/useAgentsViewController.ts"
          - "!src-tauri/src/application/chat_service/chat_service_composer_references.rs"
          - "!src-tauri/src/application/chat_service/mod.rs"
          - "!src-tauri/src/application/plan_complexity_assessment.rs"
          - "!src-tauri/src/commands/agent_composer_commands/plan_references.rs"
          - "!src-tauri/src/commands/harness_provider_commands.rs"
          - "!src-tauri/src/commands/ideation_commands/ideation_commands_session.rs"
          - "!src-tauri/src/commands/provider_cli_management_commands.rs"
          - "!src-tauri/src/commands/question_commands.rs"
          # Provider-native MCP policy commands wrap Tauri State, provider
          # catalog subprocess probes, and project lookup. Deterministic policy
          # merge/repo/client behavior is covered in focused sidecar tests.
          - "!src-tauri/src/commands/mcp_policy_commands.rs"
          # External MCP supervisor process-management branches require real
          # subprocess spawning and OS signal behavior; extracted helpers carry
          # deterministic unit coverage.
          - "!src-tauri/src/infrastructure/external_mcp_supervisor.rs"
          # Workspace Review auto-merge coordination spans GitHub adapter calls,
          # reviewer startup, publication event ordering, and startup recovery.
          # Behavior is covered by the sidecar auto-merge coordinator suite plus
          # repository atomicity tests; keep patch coverage focused on those
          # deterministic units instead of every orchestration error branch.
          - "!src-tauri/src/application/agent_workspace_review_auto_merge.rs"
          # Workspace Review presentation-context coordination owns a process-wide
          # single-flight cache, cancellation cleanup, and live Git/repository
          # reads. The public status, cache, refresh, and coalescing outcomes are
          # covered in its sidecar suite; exclude unobservable coordinator plumbing
          # from the patch gate, consistent with the adjacent auto-merge coordinator.
          - "!src-tauri/src/application/agent_workspace_review_context.rs"
          # Execution-plan scoped control command wrappers require the production
          # Tauri AppHandle runtime; helper and service behavior is covered in
          # task_commands execution-plan sidecar tests.
          - "!src-tauri/src/commands/task_commands/execution_plan_controls.rs"
          # Dedicated branch-update repair spans Tauri command wrappers, Axum
          # MCP handlers, reconciliation adapters, real git subprocess/worktree
          # orchestration, and SQLite/DbConnection persistence glue. Keep patch
          # coverage on the extracted state-machine/entity/repository-contract
          # behavior and the focused branch-update executor/repo test suites
          # rather than requiring statement coverage for every adapter branch.
          - "!src-tauri/src/application/branch_update_executor.rs"
          - "!src-tauri/src/application/branch_update_workflow.rs"
          - "!src-tauri/src/application/git_mutation_recovery.rs"
          - "!src-tauri/src/application/git_service/git_cmd.rs"
          - "!src-tauri/src/application/reconciliation/handlers/execution.rs"
          - "!src-tauri/src/commands/task_commands/mutation.rs"
          - "!src-tauri/src/http_server/handlers/branch_update.rs"
          - "!src-tauri/src/http_server/handlers/git.rs"
          - "!src-tauri/src/infrastructure/memory/memory_branch_update_repo.rs"
          - "!src-tauri/src/infrastructure/sqlite/sqlite_branch_update_repo/repository.rs"
          - "!src-tauri/src/http_server/mod.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/approval.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/create.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/edit.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/query.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/shared.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/update.rs"
          - "!src-tauri/src/http_server/handlers/ideation/proposals.rs"
          - "!src-tauri/src/http_server/handlers/plan_complexity.rs"
          - "!src-tauri/src/http_server/handlers/questions.rs"
          - "!src-tauri/src/http_server/types.rs"
          # Plan Bundle crosses Tauri commands, Axum handlers, SQLite adapters,
          # and scheduler-owned durable orchestration. Its deterministic domain,
          # service, IPC, and repository-contract behavior is covered by the
          # focused sidecar and integration suites; keep the patch gate off the
          # adapter/composition branches that require live AppState, DbConnection,
          # or background scheduling to exercise.
          - "!src-tauri/src/application/agent_task_pipeline_service.rs"
          - "!src-tauri/src/application/apply_service/mod.rs"
          - "!src-tauri/src/application/automation/scheduler.rs"
          - "!src-tauri/src/application/plan_artifact_approval.rs"
          - "!src-tauri/src/application/plan_verification_service.rs"
          - "!src-tauri/src/commands/agent_plan_commands.rs"
          - "!src-tauri/src/commands/ideation_commands/ideation_commands_apply.rs"
          - "!src-tauri/src/commands/ideation_commands/ideation_commands_cross_project.rs"
          - "!src-tauri/src/commands/ideation_commands/ideation_commands_types.rs"
          - "!src-tauri/src/http_server/handlers/agent_workspaces/mod.rs"
          - "!src-tauri/src/http_server/handlers/artifacts/linking.rs"
          - "!src-tauri/src/http_server/helpers.rs"
          - "!src-tauri/src/infrastructure/sqlite/sqlite_automation_repo.rs"
          - "!src-tauri/src/infrastructure/sqlite/sqlite_ideation_session_repo.rs"
          - "!src-tauri/src/infrastructure/sqlite/sqlite_task_proposal_repo/mod.rs"
          - "!src-tauri/src/infrastructure/agents/claude/mod.rs"
          - "!src-tauri/src/infrastructure/agents/spawner.rs"
          # Merge recovery entry points below mostly compose already-tested
          # transition helpers, command adapters, and startup reconciliation.
          # Keep the patch gate on deterministic helper/state-machine behavior.
          - "!src-tauri/src/application/reconciliation/handlers/merge.rs"
          - "!src-tauri/src/domain/state_machine/transition_handler/merge_orchestrator.rs"
          - "!src-tauri/src/commands/git_commands.rs"
          # Internal MCP package entrypoint dispatches registered tool handlers.
          # Handler behavior is covered in focused module tests.
          - "!plugins/app/ralphx-mcp-server/src/index.ts"
          # Release notes Tauri command wrappers need AppHandle<R> / State<'_, AppState>
          # and cannot be unit tested without the Tauri runtime. All testable pure
          # functions (parse, sort, collect, sanitize, read-with-reader) have full coverage.
          # Automation command wrappers follow the same Tauri State/AppState adapter
          # pattern; parser/DTO helpers are sidecar-unit tested and IPC contracts cover
          # the command surface under the Rust IPC coverage shard.
          - "!src-tauri/src/commands/automation_commands.rs"
          - "!src-tauri/src/commands/manual_role_default_commands.rs"
          - "!src-tauri/src/commands/release_notes_commands.rs"
          - "!src-tauri/src/infrastructure/sqlite/sqlite_atlassian_integration_settings_repo.rs"
          # Database maintenance Tauri command wrappers follow the same thin
          # State/AppState adapter pattern as release_notes_commands and
          # automation_commands. Deterministic maintenance logic is covered in
          # database_maintenance_tests.rs sidecar tests.
          - "!src-tauri/src/commands/database_maintenance_commands.rs"

parsers:
  lcov:
    partials_as_hits: true

ignore:
  # Rust integration tests, sidecar test modules, and shared test support.
  - "src-tauri/tests/**"
  - "src-tauri/crates/**/tests/**"
  - "src-tauri/crates/**/tests.rs"
  - "src-tauri/crates/**/*_test.rs"
  - "src-tauri/crates/**/*_tests.rs"
  - "src-tauri/src/testing/**"
  - "src-tauri/src/**/tests.rs"
  - "src-tauri/src/**/tests/**"
  - "src-tauri/src/**/*_test.rs"
  - "src-tauri/src/**/*_tests.rs"
  # Startup composition roots wire long-lived services; behavior is covered
  # through extracted helpers/services and focused scheduler/finalizer tests.
  - "src-tauri/src/application/startup_background.rs"
  - "src-tauri/src/application/orphan_worktree_cleanup.rs"
  - "src-tauri/src/application/pr_startup_recovery.rs"
  - "src-tauri/crates/ralphx-domain/src/repositories/agent_conversation_workspace_repository.rs"
  # Local repository bootstrap and GitHub auth invoke real Git/gh state. Their
  # deterministic request, validation, and result behavior is sidecar-tested.
  - "src-tauri/src/application/git_service/bootstrap.rs"
  - "src-tauri/src/infrastructure/git_auth.rs"
  # Workspace Review auto-merge coordinates GitHub calls, reviewer startup,
  # and durable recovery; deterministic behavior is covered by sidecar tests.
  - "src-tauri/src/application/agent_workspace_review_auto_merge.rs"
  # Merge recovery controller/composition surfaces coordinate long-lived Git
  # worktrees, agent routing, Tauri command glue, and startup reconciliation.
  # Deterministic PR-branch publication behavior is covered by helper and
  # state-machine tests; keep patch coverage focused on those units.
  - "src-tauri/src/application/chat_service/chat_service_merge.rs"
  - "src-tauri/src/application/chat_service/freshness_routing.rs"
  - "src-tauri/src/application/reconciliation/handlers/merge.rs"
  - "src-tauri/src/commands/git_commands.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/merge_orchestrator.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/merge_outcome_handler.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/on_enter_states/merge.rs"
  # Tauri workspace-publishing commands and their publish-panel composition
  # coordinate app handles, event emission, and background repair scheduling.
  # Their deterministic authorization and response behavior is sidecar-tested.
  - "src-tauri/src/commands/unified_chat_commands/mod.rs"
  - "src-tauri/src/commands/agent_workspace_auto_publish.rs"
  - "frontend/src/components/agents/AgentsPublishPanel.tsx"
  # Dedicated branch-update repair similarly spans command wrappers, Axum/MCP
  # handlers, reconciliation adapters, real git subprocess/worktree
  # orchestration, and persistence glue. Deterministic behavior is covered by
  # extracted entity, state-machine, executor, and repository-contract tests.
  - "src-tauri/src/application/branch_update_executor.rs"
  - "src-tauri/src/application/branch_update_workflow.rs"
  - "src-tauri/src/application/chat_service/chat_service_context.rs"
  - "src-tauri/src/application/git_service/identity.rs"
  - "src-tauri/src/application/git_mutation_recovery.rs"
  - "src-tauri/src/application/git_service/git_cmd.rs"
  - "src-tauri/src/application/reconciliation/handlers/execution.rs"
  - "src-tauri/src/application/startup_pipeline.rs"
  - "src-tauri/src/application/task_transition_service.rs"
  - "src-tauri/src/commands/task_commands/mutation.rs"
  - "src-tauri/src/domain/state_machine/machine/transitions.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/mod.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/merge_completion.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/freshness.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/on_enter_states/branch_update.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/on_enter_states/mod.rs"
  - "src-tauri/src/domain/state_machine/transition_handler/side_effects/merge_attempt/mod.rs"
  - "src-tauri/src/http_server/handlers/branch_update.rs"
  - "src-tauri/src/http_server/handlers/git.rs"
  - "src-tauri/src/infrastructure/memory/memory_branch_update_repo.rs"
  - "src-tauri/src/infrastructure/sqlite/sqlite_branch_update_repo/repository.rs"
  - "src-tauri/crates/ralphx-domain/src/entities/branch_update.rs"
  # Provider-native MCP command/process surfaces; deterministic policy behavior
  # is covered in service/repo/client sidecar tests.
  - "src-tauri/src/commands/mcp_policy_commands.rs"
  - "src-tauri/src/infrastructure/external_mcp_supervisor.rs"
  # Database maintenance Tauri command wrappers; deterministic maintenance logic
  # is covered in database_maintenance_tests.rs sidecar tests.
  - "src-tauri/src/commands/database_maintenance_commands.rs"
  # Frontend test sources, snapshots, fixtures, and mocks.
  - "frontend/tests/**"
  - "frontend/src/**/__tests__/**"
  - "frontend/src/**/__snapshots__/**"
  - "frontend/src/**/*.test.*"
  - "frontend/src/**/*.spec.*"
  - "frontend/src/**/*.testSetup.*"
  - "frontend/src/api-mock/tasks.ts"
  - "frontend/src/mocks/**"
  # Plugin MCP test sources and generated test artifacts.
  - "plugins/app/**/build/**"
  - "plugins/app/**/tests/**"
  - "plugins/app/**/__tests__/**"
  - "plugins/app/**/*.test.*"
  - "plugins/app/**/*.spec.*"

flags:
  rust-lib:
    paths:
      - "src-tauri/crates/"
      - "src-tauri/src/application/"
      - "src-tauri/src/domain/"
      - "src-tauri/src/infrastructure/"
  rust-ipc:
    paths:
      - "src-tauri/src/commands/"
      - "src-tauri/tests/"
  frontend:
    paths:
      - "frontend/src/"
  plugin-external-mcp:
    paths:
      - "plugins/app/ralphx-external-mcp/"
  plugin-internal-mcp:
    paths:
      - "plugins/app/ralphx-mcp-server/"

comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
  require_base: false
  require_head: true
  hide_project_coverage: false

flag_management:
  default_rules:
    carryforward: true
    statuses:
      - type: project
        target: auto
        threshold: 2%
      - type: patch
        target: 90%
        threshold: 0%
        only_pulls: true

github_checks:
  annotations: false
