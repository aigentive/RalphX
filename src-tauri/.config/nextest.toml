[profile.default]
fail-fast = true
slow-timeout = { period = "60s", terminate-after = 2 }
leak-timeout = "500ms"

[profile.ci]
inherits = "default"
fail-fast = false
global-timeout = "30m"
retries = 1

[profile.ci.junit]
path = "junit.xml"

# Coverage-instrumented lib shards run ~60% slower than plain test shards and
# sit near the 30m ci budget on nominal runners; 40m absorbs runner-speed
# variance while still bounding runaway runs under the 60m job timeout.
[profile.ci-coverage]
inherits = "ci"
global-timeout = "40m"

[test-groups.git-heavy]
max-threads = 2

[test-groups.sqlite-integration]
max-threads = 4

[test-groups.perf-serial]
max-threads = 1

[test-groups.capability-serial]
max-threads = 1

[[profile.default.overrides]]
filter = 'binary(plan_selector_performance)'
test-group = 'perf-serial'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(suite_transition_git) or binary(suite_pr_github) or binary(suite_agent_workspace) or (binary(suite_chat_service) and test(chat_service_merge))'
test-group = 'git-heavy'
slow-timeout = { period = "120s", terminate-after = 2 }

[[profile.default.overrides]]
filter = 'binary(suite_sqlite_repos) or binary(suite_sqlite_flows) or binary(suite_metrics)'
test-group = 'sqlite-integration'
slow-timeout = { period = "90s", terminate-after = 2 }
